<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RefRater">
<link rel="apple-touch-icon" href="/images/logos/RRlogo192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — Referees</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7289925014125722" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;--surface:#12151c;--surface2:#1a1d26;--border:#2a2d3a;
    --text:#e0d6f5;--muted:#8b7fb8;
    --pl-purple:#37003c;--pl-green:#00cc70;
    --teal:#37ecba;--yellow:#ffd32a;--red:#ff4757;--green:#00cc70;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;}

  /* shimmer bg */
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 70% 50% at 15% 20%,rgba(55,0,60,.5) 0%,transparent 65%),
               radial-gradient(ellipse 50% 50% at 85% 80%,rgba(80,0,90,.3) 0%,transparent 60%);
    animation:shimmer 14s ease-in-out infinite alternate;}
  @keyframes shimmer{0%{opacity:.6}100%{opacity:.9}}

  /* HEADER */
  header{background:rgba(10,12,16,.9);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
  .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
  .logo img{height:32px;width:auto;}
  .header-right{display:flex;align-items:center;gap:10px;}
  nav{display:flex;gap:4px;}
  nav a{color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border-radius:6px;transition:color .15s,background .15s;text-decoration:none;}
  nav a.active,nav a:hover{color:var(--text);background:var(--surface2);}
  nav a.active{color:var(--pl-green);}
  .user-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 11px 5px 6px;cursor:pointer;transition:border-color .15s;font-size:.82rem;position:relative;}
  .user-chip:hover{border-color:rgba(0,255,133,.35);}
  .uc-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#8b008b);border:1.5px solid var(--pl-green);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:var(--pl-green);flex-shrink:0;}
  .uc-name{font-weight:600;color:var(--text);}
  .preview-badge{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:#f5a623;font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
  .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:200px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.5);display:none;overflow:hidden;}
  .user-dropdown.open{display:block;}
  .dd-head{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .dd-uname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;color:var(--text);}
  .dd-team{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .dd-item{padding:11px 16px;font-size:.85rem;color:var(--muted);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:8px;}
  .dd-item:hover{background:var(--surface2);color:var(--red);}

  /* PAGE */
  .page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:24px 24px 80px;}

  /* Page header */
  .page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .page-header-left h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-transform:uppercase;letter-spacing:.3px;color:var(--text);}
  .page-header-left h1 span{color:var(--pl-green);}
  .page-header-left p{font-size:.78rem;color:var(--muted);margin-top:3px;}
  .page-stats{display:flex;gap:20px;}
  .pstat-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;color:var(--pl-green);line-height:1;}
  .pstat-lbl{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}

  /* Sort bar */
  .refs-controls{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .refs-controls-label{font-family:'Barlow Condensed',sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-right:2px;}
  .sort-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;padding:6px 12px;cursor:pointer;transition:all .15s;}
  .sort-btn:hover{border-color:rgba(0,255,133,.35);color:var(--text);}
  .sort-btn.active{background:rgba(0,204,112,.08);border-color:var(--pl-green);color:var(--pl-green);}
  .sort-btn.fan-sort.active{background:rgba(255,211,42,.08);border-color:var(--yellow);color:var(--yellow);}

  /* Column headers */
  .refs-col-heads{display:grid;grid-template-columns:28px 36px 1fr 72px 72px 48px 18px;align-items:center;gap:8px;padding:0 14px 8px;font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

  /* Ref list */
  .refs-list{display:flex;flex-direction:column;gap:4px;}

  /* Row */
  .rpc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s;}
  .rpc:hover{border-color:rgba(0,204,112,.25);}
  .rpc.open{border-color:rgba(0,204,112,.4);}
  .rpc-head{display:grid;grid-template-columns:28px 36px 1fr 72px 72px 48px 18px;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none;}
  .rpc-rank{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.9rem;color:var(--muted);text-align:center;}
  .rpc-rank.top{color:var(--pl-green);}
  .rpc-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#37003c,#6b0080);border:1.5px solid rgba(0,204,112,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.75rem;color:var(--pl-green);flex-shrink:0;}
  .rpc-info{min-width:0;}
  .rpc-name{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rpc-meta{font-size:.68rem;color:var(--muted);margin-top:1px;}
  .rpc-score-cell{text-align:center;}
  .rpc-score-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.05rem;line-height:1;}
  .rpc-score-num.nv{color:var(--teal);}
  .rpc-score-num.fv{color:var(--yellow);}
  .rpc-score-num.none{color:var(--muted);font-size:.75rem;font-weight:400;}
  .rpc-score-sub{font-size:.58rem;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.05em;}
  .rpc-games-cell{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;color:var(--muted);text-align:center;}
  .rpc-chevron{font-size:.7rem;color:rgba(0,204,112,.4);text-align:center;transition:transform .25s;}
  .rpc.open .rpc-chevron{transform:rotate(180deg);}

  /* Expand */
  .rpc-dropdown{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .rpc.open .rpc-dropdown{grid-template-rows:1fr;}
  .rpc-dropdown-inner{overflow:hidden;}
  .rpc-body{padding:12px 14px 14px;border-top:1px solid var(--border);background:var(--surface2);}

  /* Stats pills */
  .rpc-card-stats{display:flex;gap:6px;margin-bottom:12px;}
  .rpc-stat-pill{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 8px;text-align:center;}
  .rpc-stat-val{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;color:var(--text);}
  .rpc-stat-lbl{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:1px;}

  /* Scores row */
  .rpc-scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .score-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .score-box.nb{border-left:3px solid rgba(55,236,186,.5);}
  .score-box.fb{border-left:3px solid rgba(255,211,42,.5);}
  .score-lbl{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
  .score-lbl.nl{color:var(--teal);}.score-lbl.fl{color:var(--yellow);}
  .score-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;line-height:1;}
  .score-val.nv{color:var(--teal);}.score-val.fv{color:var(--yellow);}.score-val.none{color:var(--muted);font-size:.9rem;font-weight:400;}
  .score-votes{font-size:.65rem;color:var(--muted);margin-top:2px;}

  /* Bias bar */
  .bias-gap-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 10px;background:var(--surface);border:1px solid var(--border);border-radius:6px;}
  .bg-label{font-size:.7rem;color:var(--muted);flex-shrink:0;}
  .bg-track{flex:1;background:rgba(255,255,255,.08);border-radius:4px;height:5px;overflow:hidden;}
  .bg-fill{height:100%;border-radius:4px;}
  .bg-val{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.75rem;flex-shrink:0;}
  .bg-val.pos{color:var(--teal);}.bg-val.neg{color:var(--red);}.bg-val.zero{color:var(--muted);}

  /* Category bars */
  .cat-bars{margin-bottom:12px;}
  .bar-row{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:8px;margin-bottom:5px;}
  .bar-lbl{font-size:.7rem;color:var(--muted);}
  .bar-track{background:rgba(255,255,255,.07);border-radius:4px;height:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.g{background:var(--teal);}.bar-fill.y{background:var(--yellow);}.bar-fill.r{background:var(--red);}
  .bar-val{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;text-align:right;color:var(--muted);}

  /* Ref stat table */
  .ref-stat-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:.75rem;}
  .ref-stat-header,.ref-stat-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;padding:4px 6px;}
  .ref-stat-header{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-size:.65rem;border-bottom:1px solid var(--border);}
  .ref-stat-row{border-bottom:1px solid var(--border);color:var(--text);}
  .ref-stat-row:last-child{border-bottom:none;}
  .ref-stat-row span:first-child{color:var(--muted);}
  .ref-stat-row span:not(:first-child){font-family:'Barlow Condensed',sans-serif;font-weight:700;text-align:center;}
  .ref-stat-header span:not(:first-child){text-align:center;}

  /* Recent matches */
  .recent-matches-title{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:5px;}
  .recent-match-row{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 9px;display:flex;align-items:center;justify-content:space-between;font-size:.74rem;margin-bottom:3px;}
  .rm-teams{font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--text);}
  .rm-score{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted);}
  .rm-score.live{color:var(--red);}

  /* Footer */
  .rpc-footer{padding:8px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface2);}
  .rpc-games{font-size:.72rem;color:var(--muted);}
  .rpc-games strong{color:var(--text);}
  .rpc-trend{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;}
  .rpc-trend.up{color:var(--teal);}.rpc-trend.down{color:var(--red);}.rpc-trend.flat{color:var(--muted);}

  /* Data banner */
  .data-banner{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;font-size:.76rem;gap:12px;flex-wrap:wrap;display:none;}
  .db-left{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .db-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:blink 2s infinite;}
  .db-dot.off{background:var(--muted);animation:none;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .db-link{color:var(--pl-green);font-weight:600;cursor:pointer;}
  .db-link:hover{text-decoration:underline;}

  /* Toast */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--pl-green);color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;padding:12px 20px;border-radius:8px;box-shadow:0 8px 32px rgba(0,255,133,.3);transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:1000;}
  .toast.show{transform:translateY(0);opacity:1;}
  img.emoji{height:1em;width:1em;vertical-align:-.1em;}

  /* Skeletons */
  @keyframes skel-anim{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skel{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:skel-anim 1.4s infinite;border-radius:4px;}
  .skel-row-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;}
  .skel-circle{border-radius:50%;flex-shrink:0;}
  .skel-line{height:10px;}

  /* Mobile */
  @media(max-width:700px){
    .refs-col-heads{display:none;}
    .rpc-head{grid-template-columns:24px 32px 1fr 60px 60px 14px;gap:6px;padding:10px 10px;}
    .rpc-games-cell{display:none;}
    .page{padding:12px 12px 80px;}
    .page-stats{gap:14px;}
    .header-nav{display:none;}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>

<div class="mobile-nav" id="mobileNav">

  <div class="page-header">

      <p>Premier League refs ranked by community ratings · tap a row to expand</p>

      <div><div class="pstat-val" id="statRefs">–</div><div class="pstat-lbl">Referees</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
const currentUser = getCurrentUser();
if (!PREVIEW_MODE && !currentUser) { window.location.href = 'login.html'; }

let refSort = 'neutral';

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// Header init
function initHeader(){
  const team=PL_TEAMS.find(t=>t.name===currentUser?.team);
  applyUserAvatar(document.getElementById('ucAvatar'), currentUser);
  document.getElementById('ucName').textContent=currentUser?.username||'Guest';
  if (isAdmin(currentUser)) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  document.getElementById('ucTeamEmoji').textContent='';
  document.getElementById('ddName').textContent=currentUser?.username||'Guest';
  document.getElementById('ddTeam').textContent=team?`${team.emoji} ${team.name} supporter`:currentUser?.team?`${currentUser.team} supporter`:'No team selected';
  if(PREVIEW_MODE){
    const b=document.createElement('div');b.className='preview-badge';b.textContent='Preview Mode';
    document.getElementById('userChip').insertBefore(b,document.getElementById('userChip').firstChild);
  }
}

document.getElementById('userChip').addEventListener('click',e=>{e.stopPropagation();document.getElementById('userDropdown').classList.toggle('open');});
document.getElementById('hamburger').addEventListener('click',e=>{e.stopPropagation();document.getElementById('mobileNav').classList.toggle('open');});
document.addEventListener('click',()=>{document.getElementById('userDropdown').classList.remove('open');document.getElementById('mobileNav').classList.remove('open');});
document.getElementById('ddLogout').addEventListener('click', async ()=>{
  if(PREVIEW_MODE){toast('Login is disabled in Preview Mode');return;}
  await clearCurrentUser(); window.location.href='login.html';
});
document.getElementById('dbHowTo').addEventListener('click',()=>toast('See the 📖 How To Use sheet in the Excel file for setup instructions!'));

// ── RENDER REFEREES ───────────────────────────────────────
function renderRefs(){
  // Hero stats
  const totalVotes=REFS.reduce((s,r)=>s+r.neutralVotes+r.fanVotes,0);
  const ratedRefs=REFS.filter(r=>r.neutralRating!=null);
  const avgScore=ratedRefs.length?ratedRefs.reduce((s,r)=>s+r.neutralRating,0)/ratedRefs.length:0;
  document.getElementById('statRefs').textContent=REFS.length;
  document.getElementById('statVotes').textContent=totalVotes>0?totalVotes:'–';
  document.getElementById('statAvg').textContent=avgScore>0?avgScore.toFixed(1):'–';

  // Sort
  const sorted=[...REFS].sort((a,b)=>{
    if(refSort==='neutral'){
      if(a.neutralRating==null&&b.neutralRating==null)return 0;if(a.neutralRating==null)return 1;if(b.neutralRating==null)return -1;
      return b.neutralRating-a.neutralRating;
    }
    if(refSort==='fan'){
      if(a.fanRating==null&&b.fanRating==null)return 0;if(a.fanRating==null)return 1;if(b.fanRating==null)return -1;
      return b.fanRating-a.fanRating;
    }
    if(refSort==='games')return b.games-a.games;
    if(refSort==='votes')return(b.neutralVotes+b.fanVotes)-(a.neutralVotes+a.fanVotes);
    if(refSort==='bias'){
      const gA=a.neutralRating!=null&&a.fanRating!=null?Math.abs(a.neutralRating-a.fanRating):0;
      const gB=b.neutralRating!=null&&b.fanRating!=null?Math.abs(b.neutralRating-b.fanRating):0;
      return gB-gA;
    }
    return 0;
  });

  // League averages for metric bars — use direct stats from RTR Match Stats if available
  const lgData=REFS.map(r=>{
    const g=r.games||0; if(!g)return null;
    const yc=r.overall_yel!=null?r.overall_yel:(r._yc!==undefined?r._yc:MATCHES.filter(m=>m.refId===r.id&&(m.status==='complete'||m.status==='recent')).reduce((s,m)=>s+(m.yc||0),0));
    const rc=r.overall_red!=null?r.overall_red:(r._rc!==undefined?r._rc:MATCHES.filter(m=>m.refId===r.id&&(m.status==='complete'||m.status==='recent')).reduce((s,m)=>s+(m.rc||0),0));
    const pen=r._pen!==undefined?r._pen:MATCHES.filter(m=>m.refId===r.id&&(m.status==='complete'||m.status==='recent')).reduce((s,m)=>s+(m.pen||0),0);
    const varD=r._var!==undefined?r._var:MATCHES.filter(m=>m.refId===r.id&&(m.status==='complete'||m.status==='recent')).reduce((s,m)=>s+(m.var||0),0);
    return{
      cpg:(yc+rc)/g, ppg:pen/g, vpg:varD/g,
      gap:r.neutralRating!=null&&r.fanRating!=null?Math.abs(r.neutralRating-r.fanRating):null,
    };
  }).filter(Boolean);
  const avg=(arr)=>arr.length?arr.reduce((s,v)=>s+v,0)/arr.length:0;
  const lgAvg={
    cpg:avg(lgData.map(r=>r.cpg)),
    ppg:avg(lgData.map(r=>r.ppg)),
    vpg:avg(lgData.map(r=>r.vpg)),
    gap:avg(lgData.map(r=>r.gap).filter(v=>v!=null)),
  };
  const allRefTotals=REFS.map(r=>({
    cards:(r._yc!==undefined?r._yc:0)+(r._rc!==undefined?r._rc:0),
    pen:r._pen!==undefined?r._pen:0,
    var:r._var!==undefined?r._var:0,
  }));
  const metricMax={cpg:Math.max(1,...allRefTotals.map(r=>r.cards)),ppg:Math.max(1,...allRefTotals.map(r=>r.pen)),vpg:Math.max(1,...allRefTotals.map(r=>r.var)),gap:Math.max(3,...lgData.map(r=>r.gap).filter(v=>v!=null))};
  function barColor(val,avg){const t=avg*0.2;if(Math.abs(val-avg)<=t)return'y';return val>avg?'g':'r';}
  function barFixed(val,red,yellow){if(val>=red)return'r';if(val>=yellow)return'y';return'g';}

  document.getElementById('refsGrid').innerHTML=sorted.map((ref,rank)=>{
    const hasN=ref.neutralRating!=null, hasF=ref.fanRating!=null;
    const biasGap=hasN&&hasF?ref.neutralRating-ref.fanRating:null;
    const gapAbs=biasGap!==null?Math.abs(biasGap):0;
    const gapDir=biasGap!==null?(biasGap>0.1?'Fans rate lower':biasGap<-0.1?'Fans rate higher':'No bias'):' ';
    const gapClass=biasGap!==null?(biasGap>0.1?'neg':biasGap<-0.1?'pos':'zero'):'zero';
    const gapColor=biasGap!==null?(biasGap>0.1?'var(--red)':biasGap<-0.1?'var(--teal)':'var(--muted)'):'var(--muted)';

    const recentMatches=MATCHES.filter(m=>m.refId===ref.id&&m.status!=='upcoming').slice(-3);
    const playedMatches=MATCHES.filter(m=>m.refId===ref.id&&(m.status==='complete'||m.status==='recent'));
    const totalYC=ref.overall_yel!=null?ref.overall_yel:(ref._yc!==undefined?ref._yc:playedMatches.reduce((s,m)=>s+(m.yc||0),0));
    const totalRC=ref.overall_red!=null?ref.overall_red:(ref._rc!==undefined?ref._rc:playedMatches.reduce((s,m)=>s+(m.rc||0),0));
    const totalPen=ref._pen!==undefined?ref._pen:playedMatches.reduce((s,m)=>s+(m.pen||0),0);
    const totalVAR=ref._var!==undefined?ref._var:playedMatches.reduce((s,m)=>s+(m.var||0),0);
    const g=ref.games||playedMatches.length||1;
    const hasData=ref.games>0||playedMatches.length>0;
    const ppg=totalPen/g;
    const vpg=totalVAR/g;
    const yel_pg=ref.overall_yel_pg!=null?+ref.overall_yel_pg:(totalYC/g);
    const pen_pg=ref.overall_pen_pg!=null?+ref.overall_pen_pg:ppg;
    const metrics=[
      {lbl:'Yellows/Game',       hasVal:hasData, display:hasData?yel_pg.toFixed(2):'—', pct:hasData?Math.min(100,(yel_pg/5.0)*100):50,   bc:hasData?barFixed(yel_pg,4.0,3.0):'y'},
      {lbl:'Penalties/Game',     hasVal:hasData, display:hasData?pen_pg.toFixed(2):'—', pct:hasData?Math.min(100,(pen_pg/0.4)*100):50,   bc:hasData?barFixed(pen_pg,0.25,0.10):'y'},
      {lbl:'VAR Overturned/Game',hasVal:hasData, display:hasData?vpg.toFixed(2):'—',    pct:hasData?Math.min(100,(vpg/0.75)*100):50,     bc:hasData?barFixed(vpg,0.50,0.25):'y'},
      {lbl:'Fan vs Neutral Gap', hasVal:biasGap!==null, display:biasGap!==null?gapAbs.toFixed(1):'—', pct:biasGap!==null?Math.min(100,(gapAbs/metricMax.gap)*100):50, bc:biasGap!==null?barColor(gapAbs,lgAvg.gap):'y'},
    ];
    const trendClass=hasN?(ref.neutralRating>=7?'up':ref.neutralRating>=5?'flat':'down'):'flat';
    const trendText=hasN?(ref.neutralRating>=7?'▲ Good form':ref.neutralRating>=5?'→ Average':'▼ Poor form'):'No data';

    return`<div class="rpc" data-ref-id="${ref.id}">
      <div class="rpc-head">
        <div class="rpc-rank${rank<3?' top':''}">${rank+1}</div>
        <div class="rpc-av">${ref.initials}</div>
        <div class="rpc-info">
          <div class="rpc-name">${ref.name}</div>
          <div class="rpc-meta">${ref.nationality||'English'}${ref.fifaListed==='Yes'?' · FIFA':''} · ${ref.games} games</div>
        </div>
        <div class="rpc-score-cell">
          ${hasN?`<div class="rpc-score-num nv">${ref.neutralRating.toFixed(1)}</div><div class="rpc-score-sub">${ref.neutralVotes}v</div>`:`<div class="rpc-score-num none">—</div>`}
        </div>
        <div class="rpc-score-cell">
          ${hasF?`<div class="rpc-score-num fv">${ref.fanRating.toFixed(1)}</div><div class="rpc-score-sub">${ref.fanVotes}v</div>`:`<div class="rpc-score-num none">—</div>`}
        </div>
        <div class="rpc-games-cell">${ref.games}</div>
        <div class="rpc-chevron">▼</div>
      </div>
      <div class="rpc-dropdown"><div class="rpc-dropdown-inner">
        <div class="rpc-body">
          <div class="rpc-card-stats">
            <div class="rpc-stat-pill"><div class="rpc-stat-val" style="color:var(--yellow)">${totalYC}</div><div class="rpc-stat-lbl">Yellow Cards</div></div>
            <div class="rpc-stat-pill"><div class="rpc-stat-val" style="color:var(--red)">${totalRC}</div><div class="rpc-stat-lbl">Red Cards</div></div>
            <div class="rpc-stat-pill"><div class="rpc-stat-val" style="color:var(--muted)">${totalVAR}</div><div class="rpc-stat-lbl">VAR Decisions</div></div>
          </div>
          <div class="rpc-scores">
            <div class="score-box nb">
              <div class="score-lbl nl">Neutral Score</div>
              ${hasN?`<div class="score-val nv">${ref.neutralRating.toFixed(1)}<span style="font-size:.75rem;color:var(--muted)">/10</span></div><div class="score-votes">${ref.neutralVotes} votes</div>`:`<div class="score-val none">No data yet</div>`}
            </div>
            <div class="score-box fb">
              <div class="score-lbl fl">Fan Score</div>
              ${hasF?`<div class="score-val fv">${ref.fanRating.toFixed(1)}<span style="font-size:.75rem;color:var(--muted)">/10</span></div><div class="score-votes">${ref.fanVotes} votes</div>`:`<div class="score-val none">No data yet</div>`}
            </div>
          </div>
          ${biasGap!==null?`
          <div class="bias-gap-row">
            <span class="bg-label">Fan bias:</span>
            <div class="bg-track"><div class="bg-fill" style="width:${Math.min(100,gapAbs*15)}%;background:${gapColor}"></div></div>
            <span class="bg-val ${gapClass}">${gapAbs.toFixed(1)} — ${gapDir}</span>
          </div>`:''}
          <div class="cat-bars">
            ${metrics.map(m=>`<div class="bar-row"><span class="bar-lbl">${m.lbl}</span><div class="bar-track"><div class="bar-fill ${m.bc}" style="width:${m.pct}%"></div></div><span class="bar-val">${m.display}</span></div>`).join('')}
          </div>
          ${ref.overall_apps!=null?`
          <div class="ref-stat-table">
            <div class="ref-stat-header"><span></span><span>Overall</span><span>Home</span><span>Away</span></div>
            <div class="ref-stat-row"><span>Apps</span><span>${ref.overall_apps??'—'}</span><span>${ref.home_apps??'—'}</span><span>${ref.away_apps??'—'}</span></div>
            <div class="ref-stat-row"><span>Fouls/Game</span><span>${ref.overall_fouls_pg??'—'}</span><span>${ref.home_fouls_pg??'—'}</span><span>${ref.away_fouls_pg??'—'}</span></div>
            <div class="ref-stat-row"><span>Fouls/Tackle</span><span>${ref.overall_fouls_tackles??'—'}</span><span>${ref.home_fouls_tackles??'—'}</span><span>${ref.away_fouls_tackles??'—'}</span></div>
            <div class="ref-stat-row"><span>Pens/Game</span><span>${ref.overall_pen_pg??'—'}</span><span>${ref.home_pen_pg??'—'}</span><span>${ref.away_pen_pg??'—'}</span></div>
            <div class="ref-stat-row"><span>Yellows</span><span>${ref.overall_yel??'—'}</span><span>${ref.home_yel??'—'}</span><span>${ref.away_yel??'—'}</span></div>
            <div class="ref-stat-row"><span>Yellows/Game</span><span>${ref.overall_yel_pg??'—'}</span><span>${ref.home_yel_pg??'—'}</span><span>${ref.away_yel_pg??'—'}</span></div>
            <div class="ref-stat-row"><span>Reds</span><span>${ref.overall_red??'—'}</span><span>${ref.home_red??'—'}</span><span>${ref.away_red??'—'}</span></div>
            <div class="ref-stat-row"><span>Reds/Game</span><span>${ref.overall_red_pg??'—'}</span><span>${ref.home_red_pg??'—'}</span><span>${ref.away_red_pg??'—'}</span></div>
          </div>`:''}
          ${recentMatches.length?`
          <div class="recent-matches-title">Recent Matches</div>
          ${recentMatches.map(m=>`
            <div class="recent-match-row">
              <span class="rm-teams">${m.home} <span style="color:var(--muted)">vs</span> ${m.away}</span>
              <span class="rm-score${m.status==='live'?' live':''}">${m.score}</span>
            </div>`).join('')}`:''}
        </div>
        <div class="rpc-footer">
          <span class="rpc-games"><strong>${ref.games}</strong> games this season</span>
          <span class="rpc-trend ${trendClass}">${trendText}</span>
        </div>
      </div></div>
    </div>`;
  }).join('');
}

// Sort buttons
document.querySelector('.refs-controls').addEventListener('click',e=>{
  const btn=e.target.closest('[data-sort]');if(!btn)return;
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  refSort=btn.dataset.sort;
  renderRefs();
});

// Click header → toggle dropdown
document.getElementById('refsGrid').addEventListener('click',e=>{
  const head=e.target.closest('.rpc-head');if(!head)return;
  const card=head.closest('.rpc');
  card.classList.toggle('open');
});

// ── SKELETONS ─────────────────────────────────────────────
function skelRefCard() {
  return `<div class="skel-row-item">
    <div class="skel skel-circle" style="width:36px;height:36px;flex-shrink:0"></div>
    <div style="flex:1"><div class="skel skel-line" style="width:55%;margin-bottom:6px"></div><div class="skel skel-line" style="width:35%"></div></div>
    <div class="skel skel-line" style="width:40px;height:28px;border-radius:6px"></div>
    <div class="skel skel-line" style="width:40px;height:28px;border-radius:6px;margin-left:6px"></div>
  </div>`;
}

// ── START ─────────────────────────────────────────────────
initHeader();
(async () => {
  document.getElementById('refsGrid').innerHTML = Array(12).fill(skelRefCard()).join('');
  await loadRefsPageData().catch(() => {});
  {
    document.getElementById('dbDot').className = 'db-dot';
    document.getElementById('dbText').textContent = 'Live data · Supabase';
  }
  await loadIncidentRatings();
  renderRefs();
  const openRef = sessionStorage.getItem('rr_open_ref');
  if (openRef) {
    sessionStorage.removeItem('rr_open_ref');
    const card = document.querySelector(`.rpc[data-ref-id="${openRef}"]`);
    if (card) {
      card.classList.add('open');
      setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 50);
    }
  }
})();
</script>
