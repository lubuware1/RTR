<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — GW History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0c10;--surface:#12151c;--surface2:#1a1e28;--border:#242836;--accent2:#f5a623;--red:#ff4757;--yellow:#ffd32a;--green:#37ecba;--text:#e8eaf0;--muted:#6b7280;--pl-purple:#37003c;--pl-green:#00ff85;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;}

  /* === HEADER === */
  header{background:linear-gradient(135deg,#37003c 0%,#1a0020 60%,#0a0c10 100%);border-bottom:2px solid var(--pl-green);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 4px 32px rgba(0,255,133,.12);}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-decoration:none;color:var(--text);}
  .logo-badge{background:var(--pl-green);color:var(--pl-purple);width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .logo span{color:var(--pl-green);}
  .header-right{display:flex;align-items:center;gap:12px;}
  nav{display:flex;gap:6px;}
  nav a{background:none;border:1px solid transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-block;}
  nav a.active,nav a:hover{background:rgba(0,255,133,.1);border-color:var(--pl-green);color:var(--pl-green);}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px 5px 7px;cursor:pointer;transition:border-color .15s;font-size:.82rem;position:relative;}
  .user-chip:hover{border-color:rgba(0,255,133,.4);}
  .uc-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#8b008b);border:1.5px solid var(--pl-green);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:var(--pl-green);flex-shrink:0;}
  .uc-name{font-weight:600;color:var(--text);}
  .preview-badge{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:var(--accent2);font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
  .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:200px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;overflow:hidden;}
  .user-dropdown.open{display:block;}
  .dd-head{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .dd-uname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;}
  .dd-team{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .dd-item{padding:11px 16px;font-size:.85rem;color:var(--muted);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
  .dd-item:last-child{border-bottom:none;}
  .dd-item:hover{background:var(--surface2);color:var(--text);}

  /* === GW SELECTOR BAR === */
  .gw-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:62px;z-index:90;}
  .gw-bar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .gw-bar-label{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);white-space:nowrap;padding:14px 0;}
  .gw-scroll{display:flex;gap:4px;overflow-x:auto;padding:10px 0;scrollbar-width:none;}
  .gw-scroll::-webkit-scrollbar{display:none;}
  .gw-btn{background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.5px;text-transform:uppercase;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
  .gw-btn:hover{border-color:rgba(0,255,133,.3);color:var(--text);}
  .gw-btn.active{background:rgba(0,255,133,.1);border-color:var(--pl-green);color:var(--pl-green);}
  .gw-btn.current{border-color:rgba(245,166,35,.4);color:var(--accent2);}
  .gw-btn.current.active{background:rgba(245,166,35,.1);}

  /* === MAIN LAYOUT === */
  .page{max-width:1200px;margin:0 auto;padding:24px;}

  /* === GW HEADER === */
  .gw-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .gw-header-left h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.4rem;text-transform:uppercase;letter-spacing:1px;}
  .gw-header-left h2 span{color:var(--pl-green);}
  .gw-header-sub{font-size:.78rem;color:var(--muted);margin-top:3px;}
  .gw-summary-pills{display:flex;gap:8px;flex-wrap:wrap;}
  .summary-pill{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-family:'Barlow Condensed',sans-serif;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
  .summary-pill span{color:var(--text);font-size:.95rem;}

  /* === LOADING / EMPTY STATES === */
  .state-box{text-align:center;padding:60px 20px;color:var(--muted);}
  .state-box .icon{font-size:2.5rem;margin-bottom:12px;}
  .state-box p{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:1px;}
  .state-box .sub{font-family:'Barlow',sans-serif;font-size:.8rem;margin-top:5px;text-transform:none;letter-spacing:0;color:var(--muted);}

  /* === MATCH GRID === */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* === MATCH CARD === */
  .match-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .mc-header{background:var(--surface2);padding:7px 14px;display:flex;align-items:center;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
  .mc-status{padding:2px 8px;border-radius:3px;font-size:.65rem;}
  .mc-status.ft{background:rgba(55,236,186,.1);color:var(--green);}
  .mc-status.live{background:rgba(255,71,87,.1);color:var(--red);}
  .mc-status.upcoming{background:var(--surface);color:var(--muted);border:1px solid var(--border);}
  .mc-body{padding:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;}
  .mc-team{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.95rem;}
  .mc-team.away{flex-direction:row-reverse;text-align:right;}
  .mc-badge{width:30px;height:30px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0;}
  .mc-score{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;letter-spacing:-1px;white-space:nowrap;}
  .mc-score.upcoming{color:var(--muted);font-size:1rem;}
  .mc-footer{padding:8px 14px 11px;border-top:1px solid var(--border);}
  .mc-ref-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
  .mc-ref{display:flex;align-items:center;gap:7px;font-size:.8rem;}
  .mc-ref-av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#6b006b);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:var(--pl-green);flex-shrink:0;}
  .mc-ref-name{font-weight:600;color:var(--text);}
  .mc-ref-role{font-size:.68rem;color:var(--muted);}
  .mc-kickoff{font-size:.72rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:600;}
  .mc-stats{display:flex;gap:12px;}
  .mc-stat{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;}

  /* === REF SUMMARY TABLE === */
  .ref-summary{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:20px;}
  .rs-header{background:var(--surface2);padding:12px 16px;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
  .rs-head,.rs-row{display:grid;grid-template-columns:1fr 90px 50px 50px 60px 70px;gap:8px;padding:10px 16px;align-items:center;}
  .rs-head{background:var(--surface2);border-bottom:1px solid var(--border);font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .rs-row{border-bottom:1px solid var(--border);font-size:.82rem;transition:background .12s;}
  .rs-row:last-child{border-bottom:none;}
  .rs-row:hover{background:var(--surface2);}
  .rs-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;}
  .rs-match{font-size:.72rem;color:var(--muted);}
  .rs-num{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-align:center;}
  .rs-rating{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-align:center;}
  .rs-rating.high{color:var(--green);}
  .rs-rating.mid{color:var(--yellow);}
  .rs-rating.low{color:var(--red);}
  .rs-rating.none{color:var(--muted);}

  /* === NO API KEY STATE === */
  .no-key-banner{background:rgba(245,166,35,.07);border:1px solid rgba(245,166,35,.25);border-radius:8px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;font-size:.82rem;line-height:1.5;}
  .no-key-banner strong{font-family:'Barlow Condensed',sans-serif;font-size:.9rem;color:var(--accent2);}

  /* === TOAST === */
  .toast{position:fixed;bottom:24px;right:24px;background:var(--pl-green);color:var(--pl-purple);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;padding:12px 20px;border-radius:8px;box-shadow:0 8px 32px rgba(0,255,133,.3);transform:translateY(60px);opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);pointer-events:none;z-index:1000;}
  .toast.show{transform:translateY(0);opacity:1;}
</style>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14/dist/twemoji.min.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="matches.html"><img src="RRLogo.svg" alt="Ref Rater" style="height:44px;width:auto;display:block;"></a>
    <div class="header-right">
      <nav>
        <a href="matches.html">Matches</a>
        <a href="referees.html">Referees</a>
        <a href="fantasy.html">Fantasy</a>
        <a href="history.html" class="active">History</a>
      </nav>
      <div class="user-chip" id="userChip">
        <div class="uc-avatar" id="ucAvatar"></div>
        <span class="uc-name" id="ucName"></span>
        <span id="ucTeamEmoji"></span>
        <span style="color:var(--muted);font-size:.7rem;margin-left:2px">▾</span>
        <div class="user-dropdown" id="userDropdown">
          <div class="dd-head">
            <div class="dd-uname" id="ddName"></div>
            <div class="dd-team" id="ddTeam"></div>
          </div>
          <div class="dd-item" id="ddLogout">↩ Sign out</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="gw-bar">
  <div class="gw-bar-inner">
    <span class="gw-bar-label">Gameweek</span>
    <div class="gw-scroll" id="gwScroll">
      <div class="state-box" style="padding:8px 0;font-size:.75rem">Loading…</div>
    </div>
  </div>
</div>

<div class="page">
  <div id="noKeyBanner" style="display:none" class="no-key-banner">
    <span style="font-size:1.3rem">⚠️</span>
    <div>
      <strong>API key not set</strong><br>
      Add your football-data.org key to <code>shared.js</code> to load real match data.
      History still works — it will just show the mock data from the current session.
    </div>
  </div>

  <div id="gwContent">
    <div class="state-box">
      <div class="icon">📅</div>
      <p>Select a gameweek</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="shared.js"></script>
<script>
// ── AUTH ──────────────────────────────────────────────────
const currentUser = getCurrentUser();
if (!PREVIEW_MODE && !currentUser) { window.location.href = 'login.html'; }

// ── STATE ─────────────────────────────────────────────────
let maxGW = 1;
let activeGW = null;
const gwCache = {}; // matchday → raw API response

// ── HEADER ────────────────────────────────────────────────
function initHeader() {
  const team = PL_TEAMS.find(t => t.name === currentUser?.team);
  document.getElementById('ucAvatar').textContent = (currentUser?.username || '?').slice(0, 2).toUpperCase();
  document.getElementById('ucName').textContent   = currentUser?.username || 'Guest';
  document.getElementById('ucTeamEmoji').textContent = team?.emoji || '';
  document.getElementById('ddName').textContent = currentUser?.username || 'Guest';
  document.getElementById('ddTeam').textContent = team ? `${team.emoji} ${team.name} supporter` : 'No team selected';
  if (PREVIEW_MODE) {
    const badge = document.createElement('div');
    badge.className = 'preview-badge'; badge.textContent = 'Preview Mode';
    document.getElementById('userChip').insertBefore(badge, document.getElementById('userChip').firstChild);
  }
}
document.getElementById('userChip').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('userDropdown').classList.toggle('open');
});
document.addEventListener('click', () => document.getElementById('userDropdown').classList.remove('open'));
document.getElementById('ddLogout').addEventListener('click', async () => {
  if (PREVIEW_MODE) { toast('Login disabled in Preview Mode'); return; }
  await clearCurrentUser(); window.location.href = 'login.html';
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── API ───────────────────────────────────────────────────
const API_BASE = FD_API_BASE;
const hdrs = { 'X-Auth-Token': FOOTBALL_DATA_KEY };

async function fetchGW(gw) {
  if (gwCache[gw]) return gwCache[gw];
  const res = await fetch(`${API_BASE}/competitions/PL/matches?matchday=${gw}`, { headers: hdrs });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  gwCache[gw] = data;
  return data;
}

async function fetchMatchDetail(matchId) {
  const res = await fetch(`${API_BASE}/matches/${matchId}`, { headers: hdrs });
  if (!res.ok) return null;
  return res.json();
}

// ── GW SELECTOR ───────────────────────────────────────────
function buildGWSelector(current) {
  const scroll = document.getElementById('gwScroll');
  scroll.innerHTML = '';
  // Most recent first
  for (let gw = current; gw >= 1; gw--) {
    const btn = document.createElement('button');
    btn.className = 'gw-btn' + (gw === current ? ' current' : '');
    btn.textContent = `GW ${gw}`;
    btn.dataset.gw = gw;
    btn.addEventListener('click', () => loadGW(gw));
    scroll.appendChild(btn);
  }
}

function setActiveGWBtn(gw) {
  document.querySelectorAll('.gw-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.gw === gw);
  });
  // Scroll the active button into view
  const active = document.querySelector(`.gw-btn.active`);
  if (active) active.scrollIntoView({ inline: 'center', behavior: 'smooth' });
}

// ── RENDER GW CONTENT ─────────────────────────────────────
function statusLabel(status) {
  if (status === 'FINISHED' || status === 'AWARDED') return { text: 'FT',       cls: 'ft' };
  if (status === 'IN_PLAY'  || status === 'PAUSED')  return { text: 'LIVE',     cls: 'live' };
  return                                                     { text: 'UPCOMING', cls: 'upcoming' };
}

function fmtKickoff(utcDate) {
  if (!utcDate) return '';
  const d = new Date(utcDate);
  return d.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })
    + ' · ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function fmtDateRange(matches) {
  if (!matches.length) return '';
  const dates = matches.map(m => new Date(m.utcDate)).filter(Boolean);
  if (!dates.length) return '';
  const min = new Date(Math.min(...dates)), max = new Date(Math.max(...dates));
  const opts = { day: 'numeric', month: 'short' };
  if (min.toDateString() === max.toDateString())
    return min.toLocaleDateString('en-GB', { ...opts, year: 'numeric' });
  return `${min.toLocaleDateString('en-GB', opts)} – ${max.toLocaleDateString('en-GB', { ...opts, year:'numeric' })}`;
}

function renderGWContent(gw, data, details) {
  const matches = data.matches;
  const finished = matches.filter(m => m.status === 'FINISHED' || m.status === 'AWARDED');
  const live     = matches.filter(m => m.status === 'IN_PLAY'  || m.status === 'PAUSED');
  const upcoming = matches.filter(m => !['FINISHED','AWARDED','IN_PLAY','PAUSED'].includes(m.status));

  // Summary stats
  const totalYC  = [...details.values()].reduce((s, d) => s + (d?.bookings?.filter(b => b.card === 'YELLOW').length || 0), 0);
  const totalRC  = [...details.values()].reduce((s, d) => s + (d?.bookings?.filter(b => b.card === 'RED' || b.card === 'YELLOW_RED').length || 0), 0);
  const totalPen = [...details.values()].reduce((s, d) => s + (d?.goals?.filter(g => g.type === 'PENALTY').length || 0), 0);
  const totalGoals = finished.reduce((s, m) => s + (m.score?.fullTime?.home || 0) + (m.score?.fullTime?.away || 0), 0);

  // Build ref rows for summary table
  const refRows = matches.map(m => {
    const ref = m.referees?.find(r => r.type === 'REFEREE') || m.referees?.[0];
    const d   = details.get(m.id);
    const yc  = d?.bookings?.filter(b => b.card === 'YELLOW').length ?? '–';
    const rc  = d?.bookings?.filter(b => b.card === 'RED' || b.card === 'YELLOW_RED').length ?? '–';
    const home = TEAM_LOOKUP[m.homeTeam.name] || { short: m.homeTeam.shortName, emoji: '⚽' };
    const away = TEAM_LOOKUP[m.awayTeam.name] || { short: m.awayTeam.shortName, emoji: '⚽' };

    // Look up rating from our REFS store
    const knownRef = ref ? REFS.find(r =>
      r.name.toLowerCase() === ref.name.toLowerCase() ||
      ref.name.toLowerCase().endsWith(r.name.split(' ').pop().toLowerCase())
    ) : null;
    const rating = knownRef?.neutralVotes > 0 ? knownRef.neutralRating.toFixed(1) : null;
    const ratingCls = !rating ? 'none' : rating >= 7 ? 'high' : rating >= 5 ? 'mid' : 'low';

    return { ref, home, away, yc, rc, rating, ratingCls, status: m.status };
  }).filter(r => r.ref);

  document.getElementById('gwContent').innerHTML = `
    <div class="gw-header">
      <div class="gw-header-left">
        <h2>Gameweek <span>${gw}</span></h2>
        <div class="gw-header-sub">${fmtDateRange(matches)}
          &nbsp;·&nbsp; ${finished.length} played${live.length ? ` · ${live.length} live` : ''}${upcoming.length ? ` · ${upcoming.length} upcoming` : ''}
        </div>
      </div>
      <div class="gw-summary-pills">
        <div class="summary-pill">⚽ <span>${totalGoals}</span> goals</div>
        <div class="summary-pill">🟨 <span>${totalYC}</span> yellow cards</div>
        <div class="summary-pill">🟥 <span>${totalRC}</span> red cards</div>
        ${totalPen ? `<div class="summary-pill">Penalty <span>${totalPen}</span></div>` : ''}
      </div>
    </div>

    <div class="match-grid" id="matchGrid">
      ${matches.map(m => {
        const home   = TEAM_LOOKUP[m.homeTeam.name] || { short: m.homeTeam.shortName, emoji: '⚽' };
        const away   = TEAM_LOOKUP[m.awayTeam.name] || { short: m.awayTeam.shortName, emoji: '⚽' };
        const hs     = m.score?.fullTime?.home, as_ = m.score?.fullTime?.away;
        const scoreStr = (hs != null && m.status !== 'TIMED' && m.status !== 'SCHEDULED') ? `${hs}–${as_}` : null;
        const st     = statusLabel(m.status);
        const ref    = m.referees?.find(r => r.type === 'REFEREE') || m.referees?.[0];
        const d      = details.get(m.id);
        const yc     = d?.bookings?.filter(b => b.card === 'YELLOW').length ?? 0;
        const rc     = d?.bookings?.filter(b => b.card === 'RED' || b.card === 'YELLOW_RED').length ?? 0;
        const pen    = d?.goals?.filter(g => g.type === 'PENALTY').length ?? 0;
        const initials = ref ? ref.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase() : '?';

        return `<div class="match-card">
          <div class="mc-header">
            <span>Premier League · GW ${gw}</span>
            <span class="mc-status ${st.cls}">${st.text}</span>
          </div>
          <div class="mc-body">
            <div class="mc-team home">
              <div class="mc-badge">${home.emoji}</div>
              <span>${home.short}</span>
            </div>
            <div class="mc-score${!scoreStr ? ' upcoming' : ''}">${scoreStr || 'vs'}</div>
            <div class="mc-team away">
              <div class="mc-badge">${away.emoji}</div>
              <span>${away.short}</span>
            </div>
          </div>
          <div class="mc-footer">
            <div class="mc-ref-row">
              <div class="mc-ref">
                <div class="mc-ref-av">${initials}</div>
                <div>
                  <div class="mc-ref-name">${ref ? ref.name : 'TBC'}</div>
                  <div class="mc-ref-role">Referee</div>
                </div>
              </div>
              <div class="mc-kickoff">${fmtKickoff(m.utcDate)}</div>
            </div>
            ${m.status !== 'SCHEDULED' && m.status !== 'TIMED' ? `
            <div class="mc-stats">
              ${yc ? `<span class="mc-stat">🟨 ${yc}</span>` : ''}
              ${rc ? `<span class="mc-stat">🟥 ${rc}</span>` : ''}
              ${pen ? `<span class="mc-stat">⚽ ${pen} pen</span>` : ''}
              ${!yc && !rc && !pen ? '<span class="mc-stat" style="color:var(--border)">No cards</span>' : ''}
            </div>` : `<div class="mc-kickoff">${fmtKickoff(m.utcDate)}</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>

    <div class="ref-summary">
      <div class="rs-header">👔 Referees This Gameweek</div>
      <div class="rs-head">
        <div>Referee</div><div>Match</div><div style="text-align:center">🟨</div>
        <div style="text-align:center">🟥</div><div style="text-align:center">Rating</div>
        <div style="text-align:center">Status</div>
      </div>
      ${refRows.map(r => `
        <div class="rs-row">
          <div><div class="rs-name">${r.ref.name}</div></div>
          <div class="rs-match">${r.home.emoji} ${r.home.short} v ${r.away.short} ${r.away.emoji}</div>
          <div class="rs-num">${typeof r.yc === 'number' ? r.yc : '–'}</div>
          <div class="rs-num">${typeof r.rc === 'number' ? r.rc : '–'}</div>
          <div class="rs-rating ${r.ratingCls}">${r.rating ? r.rating + '/10' : '–'}</div>
          <div class="mc-status ${statusLabel(r.status).cls}" style="text-align:center;border-radius:3px;padding:2px 6px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700">
            ${statusLabel(r.status).text}
          </div>
        </div>`).join('')}
    </div>`;
}

// ── LOAD A GAMEWEEK ───────────────────────────────────────
async function loadGW(gw) {
  activeGW = gw;
  setActiveGWBtn(gw);

  document.getElementById('gwContent').innerHTML =
    '<div class="state-box"><div class="icon">⏳</div><p>Loading GW ' + gw + '…</p></div>';

  try {
    const data = await fetchGW(gw);

    // Fetch detail (cards) for finished matches only
    const finished = data.matches.filter(m => m.status === 'FINISHED' || m.status === 'AWARDED');
    const detailMap = new Map();

    const detailResults = await Promise.all(
      finished.map(m => fetchMatchDetail(m.id).catch(() => null))
    );
    finished.forEach((m, i) => { if (detailResults[i]) detailMap.set(m.id, detailResults[i]); });

    renderGWContent(gw, data, detailMap);

  } catch (e) {
    document.getElementById('gwContent').innerHTML = `
      <div class="state-box">
        <div class="icon">❌</div>
        <p>Failed to load GW ${gw}</p>
        <div class="sub">${e.message} — check your API key or try again</div>
      </div>`;
  }
}

// ── BOOT ──────────────────────────────────────────────────
initHeader();

(async () => {
  if (!FOOTBALL_DATA_KEY) {
    document.getElementById('noKeyBanner').style.display = 'flex';
    // Fall back: build selector up to the mock data's GW
    maxGW = 29;
    buildGWSelector(maxGW);
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/competitions/PL`, { headers: hdrs });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const comp = await res.json();
    maxGW = comp.currentSeason.currentMatchday;
    buildGWSelector(maxGW);
    // Auto-load most recent completed GW
    await loadGW(maxGW);
  } catch (e) {
    document.getElementById('gwContent').innerHTML = `
      <div class="state-box">
        <div class="icon">❌</div>
        <p>Could not connect to API</p>
        <div class="sub">${e.message}</div>
      </div>`;
  }
})();
</script>
<script>twemoji.parse(document.body, { folder: 'svg', ext: '.svg' });</script>
