<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RefRater">
<link rel="apple-touch-icon" href="/images/logos/RRlogo192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — Support</title>
<link rel="icon" type="image/png" sizes="192x192" href="/images/logos/RRlogo192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/images/logos/RRlogo512.png">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7289925014125722" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { background: var(--bg); }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 30%, rgba(55,0,60,.08) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 70%, rgba(80,0,90,.06) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }
  .page { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; padding: 32px 20px 80px; }

  .support-hero { padding: 8px 0 28px; }
  .support-hero h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 1px; color: var(--pl-green); }
  .support-hero p { color: var(--muted); font-size: .88rem; margin-top: 6px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }

  .field-label { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .72rem; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
  .field-group { margin-bottom: 16px; }
  .field-hint { font-size: .74rem; color: var(--muted); margin-top: 5px; }
  .support-input, .support-select, .support-textarea {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .92rem;
    padding: 10px 12px; outline: none; transition: border-color .15s;
  }
  .support-textarea { font-family: 'Barlow', sans-serif; font-weight: 400; resize: vertical; min-height: 130px; line-height: 1.5; }
  .support-input:focus, .support-select:focus, .support-textarea:focus { border-color: var(--pl-green); }
  .char-count { font-size: .7rem; color: var(--muted); text-align: right; margin-top: 4px; }

  .cat-tabs { display: flex; gap: 8px; margin-bottom: 4px; }
  .cat-tab {
    flex: 1; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 8px; text-align: center; cursor: pointer; transition: all .15s;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: .78rem; letter-spacing: .3px;
    text-transform: uppercase; color: var(--muted);
  }
  .cat-tab.active { border-color: var(--pl-green); color: var(--pl-green); background: rgba(0,204,112,.07); }

  .form-error { color: var(--red); font-size: .82rem; margin-bottom: 14px; display: none; }
  .btn-save {
    width: 100%; background: var(--pl-green); color: #fff; border: none; border-radius: 8px;
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: .95rem; letter-spacing: .5px;
    text-transform: uppercase; padding: 12px; cursor: pointer; transition: opacity .15s;
  }
  .btn-save:hover { opacity: .88; } .btn-save:disabled { opacity: .5; cursor: not-allowed; }

  .sent-state { text-align: center; padding: 24px 10px; }
  .sent-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .sent-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 1.15rem; color: var(--text); margin-bottom: 6px; }
  .sent-sub { font-size: .85rem; color: var(--muted); margin-bottom: 18px; }

  .signin-prompt { text-align: center; padding: 20px; font-size: .88rem; color: var(--muted); }
  .signin-prompt a { color: var(--pl-green); text-decoration: none; font-weight: 600; }
  .signin-prompt a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="matches.html"><img src="images/logos/RRLogo.svg" alt="RefRater" style="height:44px;width:auto;display:block;"></a>
    <div class="header-right">
      <nav>
        <a href="index.html">Home</a>
        <a href="matches.html">Matches</a>
        <a href="referees.html">Referees</a>
        <a href="badges.html">Cards</a>
        <a href="forum.html">Forum</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="user-chip" id="userChip">
        <div class="uc-avatar" id="ucAvatar"></div>
        <span class="uc-name" id="ucName"></span>
        <span id="ucTeamEmoji"></span>
        <span style="color:var(--muted);font-size:.7rem;margin-left:2px">▾</span>
        <div class="user-dropdown" id="userDropdown">
          <div class="dd-head">
            <div class="dd-name" id="ddName"></div>
            <div class="dd-team" id="ddTeam"></div>
          </div>
          <div class="dd-item" onclick="location.href='profile.html'">👤 My Profile</div>
          <div class="dd-item" onclick="location.href='badges.html'">🏅 Cards</div>
          <div class="dd-item" onclick="location.href='support.html'">🛟 Support</div>
          <div class="dd-item admin-only" style="display:none" onclick="location.href='fantasy.html'"><img src="images/logos/PVBBlogo-removebg-preview.png" alt="PVBB" style="height:16px;width:auto;vertical-align:middle;margin-right:6px;">PVBB</div>
          <div class="dd-item admin-only" style="display:none" onclick="location.href='team_task_manager.html'">📋 Tasks</div>
          <div class="dd-item danger" id="ddLogout">↩ Sign out</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav">
  <a href="index.html">Home</a>
  <a href="matches.html">Matches</a>
  <a href="referees.html">Referees</a>
  <a href="badges.html">Cards</a>
  <a href="forum.html">Forum</a>
</div>

<div class="page">
  <div class="support-hero">
    <h1>Support</h1>
    <p>Found a bug, or got feedback on how RefRater should work? Tell us directly.</p>
  </div>

  <div id="supportRoot">
    <div class="card"><p style="color:var(--muted);font-size:.85rem;">Loading…</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;
let selectedCategory = 'bug';

function initHeader() {
  const user = getCurrentUser();
  currentUser = user;
  if (!user) {
    const nm = document.getElementById('ucName'); if (nm) nm.textContent = 'Login';
    const av = document.getElementById('ucAvatar'); if (av) av.textContent = '→';
    const chip = document.getElementById('userChip'); if (chip) chip.addEventListener('click', () => { window.location.href = 'login.html'; });
    const hb = document.getElementById('hamburger'); if (hb) hb.addEventListener('click', () => { document.getElementById('mobileNav')?.classList.toggle('open'); });
    return;
  }
  applyUserAvatar(document.getElementById('ucAvatar'), user);
  document.getElementById('ucName').textContent = user.username || 'User';
  document.getElementById('ucTeamEmoji').textContent = '';
  document.getElementById('ddName').textContent = user.username || 'User';
  document.getElementById('ddTeam').textContent = user.team ? `${user.team} fan` : 'No team set';
  if (isAdmin(user)) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');

  document.getElementById('userChip').addEventListener('click', () => {
    document.getElementById('userDropdown').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#userChip')) document.getElementById('userDropdown').classList.remove('open');
  });
  document.getElementById('ddLogout').addEventListener('click', async () => {
    await clearCurrentUser(); window.location.href = 'login.html';
  });
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('mobileNav').classList.toggle('open');
  });
  initNotificationBell(user);
}

function renderForm() {
  const referrer = (document.referrer && !document.referrer.includes('support.html')) ? document.referrer : '';
  document.getElementById('supportRoot').innerHTML = `
    <div class="card">
      <div class="cat-tabs" id="catTabs">
        <div class="cat-tab active" data-cat="bug">🐛 Bug</div>
        <div class="cat-tab" data-cat="feedback">💡 Feedback</div>
        <div class="cat-tab" data-cat="other">✉️ Other</div>
      </div>
      <div class="field-hint" style="margin-bottom:18px;">${
        selectedCategory === 'bug' ? 'Something broken or not working as expected.'
        : selectedCategory === 'feedback' ? 'An idea, suggestion, or something you\'d like to see.'
        : 'Anything else you want to tell us.'
      }</div>

      <div class="form-error" id="formError"></div>

      <div class="field-group">
        <label class="field-label">Message</label>
        <textarea class="support-textarea" id="msgInput" maxlength="2000" placeholder="${
          selectedCategory === 'bug' ? 'What happened? What page were you on, and what did you expect instead?' : 'Tell us what\'s on your mind…'
        }"></textarea>
        <div class="char-count" id="charCount">0 / 2000</div>
      </div>

      <div class="field-group">
        <label class="field-label">Page (optional)</label>
        <input type="text" class="support-input" id="pageInput" value="${escapeHtml(referrer)}" placeholder="e.g. matches.html">
        <div class="field-hint">Auto-filled from where you came from — edit or clear if it's not relevant.</div>
      </div>

      <button class="btn-save" id="sendBtn">Send to RefRater</button>
    </div>
  `;

  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedCategory = tab.dataset.cat;
      renderForm();
    });
  });

  const msgInput = document.getElementById('msgInput');
  msgInput.addEventListener('input', () => {
    document.getElementById('charCount').textContent = `${msgInput.value.length} / 2000`;
  });

  document.getElementById('sendBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('formError');
    errEl.style.display = 'none';
    const message = msgInput.value.trim();
    if (!message) { errEl.textContent = 'Please write a message first'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true; btn.textContent = 'Sending…';

    const { error } = await getSB().from('RTR Support Messages').insert({
      user_id: currentUser.id,
      username: currentUser.username || 'User',
      email: currentUser.email || null,
      category: selectedCategory,
      message,
      page_url: document.getElementById('pageInput').value.trim() || null,
    });

    btn.disabled = false; btn.textContent = 'Send to RefRater';
    if (error) {
      console.error('[RTR] support message insert error:', error);
      errEl.textContent = 'Something went wrong sending that — please try again';
      errEl.style.display = 'block';
      return;
    }
    renderSentState();
  });
}

function renderSentState() {
  document.getElementById('supportRoot').innerHTML = `
    <div class="card sent-state">
      <div class="sent-icon">✅</div>
      <div class="sent-title">Thanks — got it.</div>
      <div class="sent-sub">Your message has been sent. We read every one, though we can't always reply individually.</div>
      <button class="btn-save" id="sendAnotherBtn" style="max-width:220px;margin:0 auto;">Send another</button>
    </div>
  `;
  document.getElementById('sendAnotherBtn').addEventListener('click', () => { selectedCategory = 'bug'; renderForm(); });
}

(async function init() {
  await checkAuth();
  initHeader();
  if (!currentUser) {
    document.getElementById('supportRoot').innerHTML = `
      <div class="card">
        <div class="signin-prompt"><a href="login.html">Sign in</a> to send us a bug report or feedback.</div>
      </div>`;
    return;
  }
  renderForm();
})();
</script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
</body>
</html>
