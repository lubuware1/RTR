<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RefRater — API Test</title>
<link rel="icon" type="image/png" sizes="192x192" href="/images/logos/RRlogo192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/images/logos/RRlogo512.png">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d0d;color:#f0f0f0;font-family:'Segoe UI',sans-serif;padding:24px}
  h1{font-size:1.4rem;margin-bottom:20px;color:#00e676}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
  .controls label{font-size:.85rem;color:#aaa}
  input[type=number]{background:#1e1e1e;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:8px;font-size:1rem;width:90px}
  button{background:#00e676;color:#000;border:none;padding:9px 20px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem}
  button:hover{background:#00c853}
  #status{font-size:.85rem;color:#aaa;margin-left:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden}
  .card-head{background:#111;padding:10px 14px;font-size:.7rem;font-weight:700;letter-spacing:1px;color:#666;display:flex;justify-content:space-between}
  .card-head .badge{padding:2px 8px;border-radius:20px;font-size:.65rem;font-weight:700;letter-spacing:.5px}
  .finished{background:#1b3a1b;color:#00e676}.live{background:#3a1a1a;color:#ff5252}.upcoming{background:#1a1a2a;color:#7c8cf8}
  .teams{display:flex;align-items:center;justify-content:space-between;padding:18px 14px}
  .team{display:flex;flex-direction:column;align-items:center;gap:8px;width:90px}
  .team span{font-size:.8rem;font-weight:600;text-align:center;line-height:1.2}
  .crest{width:44px;height:44px;object-fit:contain}
  .crest-fallback{width:44px;height:44px;background:#222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#555}
  .score{font-size:2rem;font-weight:900;font-family:'Barlow Condensed','Segoe UI',sans-serif;letter-spacing:-2px;color:#fff;text-align:center;min-width:60px}
  .score.live{color:#ff5252}
  .score small{display:block;font-size:.65rem;font-weight:600;color:#555;letter-spacing:1px;text-align:center;margin-top:2px}
  .ref-row{padding:0 14px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid #222;padding-top:12px;margin-top:0}
  .ref-avatar{width:28px;height:28px;background:#2a2a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#888;flex-shrink:0}
  .ref-name{font-size:.8rem;font-weight:600}
  .ref-label{font-size:.65rem;color:#555}
  .no-ref{font-size:.75rem;color:#444;font-style:italic}
  .err{background:#2a1a1a;border:1px solid #ff525244;border-radius:12px;padding:20px;color:#ff7070;font-size:.9rem;line-height:1.6}
  .raw-toggle{margin-top:24px}
  .raw-toggle button{background:#222;color:#aaa;font-size:.8rem;padding:6px 14px}
  pre{background:#111;border:1px solid #222;border-radius:10px;padding:16px;font-size:.72rem;overflow:auto;max-height:400px;margin-top:10px;color:#8bc34a;display:none}
</style>
</head>
<body>
<h1>⚽ football-data.org API Test</h1>

<div class="controls">
  <label>Competition</label>
  <input type="text" id="compInput" value="WC" style="width:70px;text-transform:uppercase">
  <label>Matchweek</label>
  <input type="number" id="gwInput" value="1" min="1" max="64">
  <label>Season</label>
  <input type="number" id="seasonInput" value="2026" min="2020" max="2030" style="width:100px">
  <button onclick="load()">Load Matches</button>
  <span id="status"></span>
</div>

<div id="grid" class="grid"></div>

<div class="raw-toggle">
  <button onclick="toggleRaw()">Toggle raw JSON</button>
  <pre id="raw"></pre>
</div>

<script>
const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
const FD_KEY  = '15b079ce9d02424994eae82a3e5f4a31';
let lastData  = null;

function statusLabel(s) {
  if (!s) return ['upcoming','?'];
  if (s === 'FINISHED') return ['finished','FT'];
  if (s === 'IN_PLAY' || s === 'PAUSED') return ['live','LIVE'];
  if (s === 'HALF_TIME') return ['live','HT'];
  return ['upcoming', s === 'TIMED' || s === 'SCHEDULED' ? 'UPCOMING' : s];
}

function crestImg(url, name) {
  if (!url) return `<div class="crest-fallback">${(name||'?').slice(0,3).toUpperCase()}</div>`;
  return `<img class="crest" src="${url}" onerror="this.outerHTML='<div class=crest-fallback>${(name||'?').slice(0,3).toUpperCase()}</div>'" alt="${name}">`;
}

function scoreText(m) {
  const s = m.score?.fullTime;
  if (s?.home != null && s?.away != null) return `${s.home}–${s.away}`;
  return '–';
}

function renderCards(matches) {
  return matches.map(m => {
    const [cls, label] = statusLabel(m.status);
    const ref = (m.referees||[]).find(r => r.type === 'REFEREE') || m.referees?.[0];
    const initials = ref ? ref.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : '';
    const ht = m.score?.halfTime;
    const htText = (ht?.home != null && ht?.away != null) ? `HT ${ht.home}–${ht.away}` : '';
    const kickoff = m.utcDate ? new Date(m.utcDate).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',',' ') : '';
    return `
    <div class="card">
      <div class="card-head">
        <span>GW${m.matchday} · Premier League</span>
        <span class="badge ${cls}">${label}</span>
      </div>
      <div class="teams">
        <div class="team">
          ${crestImg(m.homeTeam?.crest, m.homeTeam?.shortName)}
          <span>${m.homeTeam?.shortName || m.homeTeam?.name || '?'}</span>
        </div>
        <div>
          <div class="score ${cls==='live'?'live':''}">${scoreText(m)}<small>${cls==='upcoming'?kickoff:htText||''}</small></div>
        </div>
        <div class="team">
          ${crestImg(m.awayTeam?.crest, m.awayTeam?.shortName)}
          <span>${m.awayTeam?.shortName || m.awayTeam?.name || '?'}</span>
        </div>
      </div>
      <div class="ref-row">
        ${ref
          ? `<div class="ref-avatar">${initials}</div><div><div class="ref-name">${ref.name}</div><div class="ref-label">Referee</div></div>`
          : `<div class="no-ref">No referee assigned</div>`}
      </div>
    </div>`;
  }).join('');
}

async function load() {
  const gw     = document.getElementById('gwInput').value;
  const season = document.getElementById('seasonInput').value;
  const comp   = document.getElementById('compInput').value.toUpperCase() || 'PL';
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');
  statusEl.textContent = 'Loading…';
  grid.innerHTML = '';

  const url = isLocal
    ? `/api/fd-matches?matchday=${gw}&season=${season}&comp=${comp}`
    : `/.netlify/functions/fd-matches?matchday=${gw}&season=${season}&comp=${comp}`;
  const opts = {};

  try {
    const res = await fetch(url, opts);
    const data = await res.json();
    lastData = data;
    document.getElementById('raw').textContent = JSON.stringify(data, null, 2);

    if (!res.ok) {
      grid.innerHTML = `<div class="err"><strong>API error ${res.status}</strong><br>${data.message || JSON.stringify(data)}</div>`;
      statusEl.textContent = `Error ${res.status}`;
      return;
    }
    const matches = data.matches || [];
    if (!matches.length) {
      grid.innerHTML = `<div class="err">No matches returned for GW${gw} season ${season}.</div>`;
      statusEl.textContent = '0 matches';
      return;
    }
    grid.innerHTML = renderCards(matches);
    statusEl.textContent = `${matches.length} matches loaded ✓`;
  } catch(e) {
    grid.innerHTML = `<div class="err"><strong>Fetch failed</strong><br>${e.message}<br><br>On localhost, this is a CORS block — try deploying to Netlify.</div>`;
    statusEl.textContent = 'Failed';
  }
}

function toggleRaw() {
  const pre = document.getElementById('raw');
  pre.style.display = pre.style.display === 'block' ? 'none' : 'block';
}

load();
</script>
</body>
</html>
