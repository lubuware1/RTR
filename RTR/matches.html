<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RefRater">
<link rel="apple-touch-icon" href="/images/logos/RRlogo192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — Matches</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7289925014125722" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f0ff;--surface:#ffffff;--surface2:#ede6ff;--border:#cfc0ee;--accent2:#f5a623;--red:#e02d42;--yellow:#d4920a;--green:#009960;--text:#6a58a0;--muted:#6a58a0;--pl-purple:#37003c;--pl-green:#00cc70;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh;}

  header{background:linear-gradient(135deg,#37003c 0%,#1a0020 60%,#0a0c10 100%);border-bottom:2px solid var(--pl-green);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 4px 32px rgba(0,255,133,.12);}
  .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.6rem;text-decoration:none;color:var(--text);}
  .logo-badge{background:var(--pl-green);color:#fff;width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .logo span{color:var(--pl-green);}
  .header-right{display:flex;align-items:center;gap:12px;}
  nav{display:flex;gap:6px;}
  nav a{background:none;border:1px solid transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:.9rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:6px 14px;border-radius:4px;cursor:pointer;transition:all .18s;text-decoration:none;display:inline-block;}
  nav a.active,nav a:hover{background:rgba(0,255,133,.1);border-color:var(--pl-green);color:var(--pl-green);}
  .user-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px 5px 7px;cursor:pointer;transition:border-color .15s;font-size:.82rem;position:relative;}
  .user-chip:hover{border-color:rgba(0,255,133,.4);}
  .uc-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#8b008b);border:1.5px solid var(--pl-green);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:var(--pl-green);flex-shrink:0;}
  .uc-name{font-weight:600;color:var(--text);}
  .preview-badge{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.4);color:var(--accent2);font-family:'Barlow Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:4px;}
  .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:200px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.4);display:none;overflow:hidden;}
  .user-dropdown.open{display:block;}
  .dd-head{padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface2);}
  .dd-uname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;}
  .dd-team{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .dd-item{padding:11px 16px;font-size:.85rem;color:var(--muted);cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
  .dd-item:last-child{border-bottom:none;}
  .dd-item:hover{background:var(--surface2);color:var(--text);}
  .dd-item.danger:hover{color:var(--red);}

  .container{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 360px;gap:24px;}
  .section-title{font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .fan-banner{background:linear-gradient(90deg,rgba(0,255,133,.06),transparent);border:1px solid rgba(0,255,133,.15);border-radius:8px;padding:9px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:.82rem;}
  .fan-banner strong{color:var(--pl-green);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;}

  /* Ad Banners */
  .ad-banner{background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;height:72px;position:relative;overflow:hidden;}
  .ad-banner-label{position:absolute;top:4px;left:8px;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.5;z-index:1;}
  .ad-banner-scroll{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;}
  .ad-banner-track{display:flex;align-items:center;gap:56px;animation:adScroll 22s linear infinite;flex-shrink:0;}
  .ad-banner-track img{height:26px;width:auto;opacity:.65;flex-shrink:0;}
  @keyframes adScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

  /* Match Cards */
  .match-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .2s,transform .15s;cursor:pointer;}
  .match-card:hover{border-color:rgba(0,255,133,.3);transform:translateY(-1px);}
  .match-card.selected{border-color:var(--pl-green);box-shadow:0 0 0 1px rgba(0,255,133,.2),0 4px 20px rgba(0,255,133,.08);}
  .match-card.fan-match{border-color:rgba(0,255,133,.22);}
  .match-header{background:var(--surface2);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);pointer-events:none;}
  .live-dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:5px;animation:blink 1.2s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .match-body{padding:14px 16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;}
  .team{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;}
  .team.away{flex-direction:row-reverse;text-align:right;}
  .team-badge{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;border:2px solid var(--border);}
  .score-block{text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.3rem;color:var(--text);letter-spacing:-.5px;white-space:normal;line-height:1.1;}
  .score-block .time{display:block;font-size:.65rem;font-weight:600;color:var(--muted);letter-spacing:1px;margin-top:4px;}
  .footer-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:var(--text);letter-spacing:-1px;}
  .match-footer{padding:8px 16px 10px;border-top:2px solid rgba(0,204,112,.3);background:rgba(0,204,112,.06);pointer-events:none;}
  .ref-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;position:relative;}
  .footer-score{position:absolute;left:50%;transform:translateX(-50%);}
  .ref-info{display:flex;align-items:center;gap:8px;font-size:.82rem;}
  .ref-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#6b006b);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:var(--pl-green);flex-shrink:0;overflow:hidden;}
  .ref-name{font-weight:600;color:var(--text);}.ref-role{font-size:.7rem;color:var(--muted);}
  .rate-ref-btn{pointer-events:auto;background:none;border:1px solid rgba(0,204,112,.45);border-radius:6px;color:var(--pl-green);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.5px;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .15s;}
  .rate-ref-btn:hover{background:rgba(0,204,112,.12);border-color:var(--pl-green);}
  .card-stats{display:flex;gap:14px;padding:0 0 6px;pointer-events:none;}
  .stat-pill{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;}
  .stat-pill .icon{font-size:.85rem;}
  .stat-pill.yc .icon{color:var(--yellow);}.stat-pill.rc .icon{color:var(--red);}
  .my-team-tag{font-size:.65rem;background:rgba(0,255,133,.12);color:var(--pl-green);border:1px solid rgba(0,255,133,.25);border-radius:4px;padding:1px 6px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;text-transform:uppercase;}
  .vote-split{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
  .vote-bucket{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;}
  .vote-bucket.nb{border-color:rgba(55,236,186,.2);}.vote-bucket.fb{border-color:rgba(255,211,42,.2);}
  .vb-label{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;}
  .vb-label.nl{color:var(--green);}.vb-label.fl{color:var(--yellow);}
  .vb-stars{display:flex;gap:1px;margin-top:2px;}
  .vb-star{font-size:.6rem;color:var(--border);}
  .vb-star.ln{color:var(--green);}.vb-star.lf{color:var(--yellow);}
  .vb-score{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.95rem;text-align:right;}
  .vb-score.ns{color:var(--green);}.vb-score.fs{color:var(--yellow);}.vb-score.na{color:var(--muted);}
  .vb-count{font-size:.62rem;color:var(--muted);margin-top:1px;text-align:right;}

  .view-tabs{display:flex;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px;gap:0;}
  .view-tab{flex:1;background:none;border:none;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.5px;text-transform:uppercase;padding:8px;border-radius:6px;cursor:pointer;transition:all .15s;}
  .view-tab.active{background:var(--surface2);color:var(--pl-green);border:1px solid rgba(0,255,133,.2);}

  /* Rating Panel */
  .rating-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:sticky;top:84px;}
  .panel-head{background:linear-gradient(135deg,var(--pl-purple),#2a0035);padding:16px 20px;border-bottom:1px solid rgba(0,255,133,.2);display:flex;align-items:center;justify-content:space-between;}
  .panel-head-text h2{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--pl-green);}
  .panel-head-text p{font-size:.78rem;color:#fff;margin-top:2px;}
  .panel-close-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:rgba(255,255,255,.5);font-size:1rem;line-height:1;padding:4px 9px;cursor:pointer;transition:all .15s;display:none;}
  .panel-close-btn:hover{background:rgba(255,71,87,.15);border-color:rgba(255,71,87,.4);color:var(--red);}
  .panel-close-btn.visible{display:block;}
  .panel-body{padding:16px;}

  /* ── COMBINED MATCH + REF BANNER ── */
  .rp-match-banner{background:linear-gradient(135deg,rgba(55,0,60,.85),rgba(20,0,30,.95));border:1px solid rgba(0,255,133,.15);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .rp-match-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;}
  .rp-match-teams{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.05rem;color:#fff;line-height:1.2;}
  .rp-match-meta{font-size:.7rem;color:#fff;margin-top:3px;}
  .rp-match-score{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:var(--pl-green);flex-shrink:0;margin-top:1px;}
  .rp-ref-row{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);}
  .rp-ref-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pl-purple),#6b006b);border:1.5px solid rgba(0,255,133,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.62rem;color:var(--pl-green);flex-shrink:0;overflow:hidden;}
  .rp-ref-name{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.9rem;color:#fff;}
  .rp-ref-badge{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(0,255,133,.6);background:rgba(0,255,133,.07);border:1px solid rgba(0,255,133,.2);border-radius:4px;padding:2px 7px;}

  /* ── COMMUNITY SCORES ── */
  .rp-scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .rp-score-tile{background:linear-gradient(135deg,rgba(55,0,60,.85),rgba(20,0,30,.95));border:1px solid rgba(0,255,133,.15);border-radius:10px;padding:14px 10px;text-align:center;}
  .rp-score-tile.nt{border-color:rgba(55,236,186,.2);}
  .rp-score-tile.ft{border-color:rgba(255,211,42,.2);}
  .rp-score-label{font-family:'Barlow Condensed',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
  .rp-score-label.nt{color:var(--green);}
  .rp-score-label.ft{color:var(--yellow);}
  .inc-tile-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.2rem;line-height:1;}
  .inc-tile-val.g{color:var(--green);}.inc-tile-val.y{color:var(--yellow);}.inc-tile-val.r{color:var(--red);}
  .inc-tile-val.pending{color:var(--muted);font-size:.92rem;padding:6px 0;}
  .inc-tile-denom{font-size:.75rem;color:rgba(255,255,255,.7);font-family:'Barlow Condensed',sans-serif;margin-left:1px;}
  .inc-tile-sub{font-size:.62rem;color:rgba(255,255,255,.6);margin-top:4px;}
  .inc-pending-badge{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;background:rgba(107,114,128,.12);color:rgba(255,255,255,.7);border:1px solid rgba(107,114,128,.2);border-radius:4px;padding:2px 7px;margin-top:5px;}

  /* ── INCIDENT VOTING ── */
  .inc-pregame{text-align:center;padding:28px 16px;border:1px dashed var(--border);border-radius:10px;}
  .inc-pregame-icon{font-size:1.8rem;margin-bottom:8px;}
  .inc-pregame-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1rem;margin-bottom:4px;}
  .inc-pregame-sub{font-size:.78rem;color:var(--muted);}
  /* Flag a Decision button */
  .rp-flag-btn{width:100%;background:none;border:1px solid rgba(139,0,139,.35);border-radius:8px;padding:10px 14px;color:rgba(200,100,200,.85);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.85rem;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:14px;}
  .rp-flag-btn:hover{background:rgba(139,0,139,.1);border-color:rgba(139,0,139,.6);}
  .rp-flag-btn:disabled{opacity:.35;cursor:not-allowed;}
  /* Decisions section label */
  .rp-dec-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  /* Decision cards */
  .inc-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:8px;transition:opacity .2s;}
  .inc-card.voted{opacity:.6;}
  .inc-card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .inc-card-type{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text);flex:1;}
  .inc-minute{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;color:var(--pl-green);background:rgba(0,255,133,.08);border:1px solid rgba(0,255,133,.18);border-radius:4px;padding:2px 7px;flex-shrink:0;}
  .inc-card-detail{font-size:.8rem;color:var(--muted);margin-bottom:4px;}
  .inc-card-outcome{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.88rem;text-transform:uppercase;letter-spacing:.3px;margin-bottom:10px;}
  .inc-empty{text-align:center;padding:20px 16px;color:var(--muted);font-size:.82rem;border:1px dashed var(--border);border-radius:8px;}
  /* Vote buttons */
  .inc-vote-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .inc-vote-btn{border:1.5px solid var(--border);border-radius:8px;padding:12px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.9rem;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .18s;background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;}
  .inc-vote-btn.correct:hover:not(:disabled){background:rgba(0,204,112,.12);border-color:var(--pl-green);color:var(--pl-green);}
  .inc-vote-btn.wrong:hover:not(:disabled){background:rgba(139,0,139,.12);border-color:#8b008b;color:rgba(200,100,200,.95);}
  .inc-vote-btn.correct.voted{background:rgba(0,204,112,.08);border-color:rgba(0,204,112,.3);color:rgba(0,204,112,.6);}
  .inc-vote-btn.wrong.voted{background:rgba(139,0,139,.08);border-color:rgba(139,0,139,.35);color:rgba(200,100,200,.6);}
  .inc-vote-btn:disabled{opacity:.4;cursor:not-allowed;}
  .inc-bar-wrap{display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-weight:700;}
  .inc-bar{flex:1;height:4px;border-radius:3px;background:var(--border);overflow:hidden;display:flex;}
  .inc-bar-fill{height:100%;background:var(--pl-green);transition:width .4s ease;}
  .inc-bar-fill-wrong{height:100%;background:#8b008b;transition:width .4s ease;}
  /* Match discussion */
  .match-discuss{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);}
  .match-discuss-label{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .match-discuss-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-family:'Barlow',sans-serif;font-size:.85rem;resize:none;min-height:70px;box-sizing:border-box;transition:border-color .2s;}
  .match-discuss-input:focus{outline:none;border-color:rgba(0,255,133,.4);}
  .match-discuss-send{margin-top:8px;background:var(--pl-green);color:#fff;border:none;border-radius:7px;padding:9px 18px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:opacity .15s;}
  .match-discuss-send:hover{opacity:.85;}
  .match-discuss-send:disabled{opacity:.45;cursor:not-allowed;}
  .match-discuss-link{margin-top:8px;font-size:.75rem;color:var(--muted);}
  .match-discuss-link a{color:var(--pl-green);text-decoration:none;}
  .match-discuss-link a:hover{text-decoration:underline;}

  /* Leaderboard */
  .leaderboard{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px;}
  .lb-header{background:var(--surface2);padding:12px 16px;font-family:'Barlow Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .lb-tabs{display:flex;gap:4px;}
  .lb-tab{background:none;border:1px solid transparent;border-radius:4px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;color:var(--muted);transition:all .12s;}
  .lb-tab.active{border-color:var(--pl-green);color:var(--pl-green);background:rgba(0,255,133,.07);}
  .lb-tab.ft.active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,211,42,.07);}
  .lb-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer;}
  .lb-row:hover{background:var(--surface2);}
  .lb-row:last-child{border-bottom:none;}

  .drum-arrow{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:6px;width:36px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:rgba(255,255,255,.35);font-size:.8rem;transition:all .15s;flex-shrink:0;}
  .drum-arrow:hover:not([disabled]){border-color:rgba(0,255,133,.5);color:var(--pl-green);background:rgba(0,255,133,.08);}

  .drum-hint{font-family:'Barlow Condensed',sans-serif;font-size:.65rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.2);}
  /* ── VOTE BUTTONS ─────────────────────────────────────── */
  .drum-vote-section{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 4px;}
  .drum-vote-btn{border-radius:10px;padding:15px 10px 13px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1rem;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:5px;border:2px solid;}

  .drum-vote-btn.wrong.active{background:#8b008b;border-color:#8b008b;color:#fff;box-shadow:0 4px 20px rgba(139,0,139,.4);}
  .drum-vote-btn.wrong.active .dvb-icon{transform:scale(1.1);}
  .drum-vote-btn:disabled{opacity:.3;cursor:not-allowed;}

  /* ── LIGHT MODE OVERRIDES ─────────────────────────────── */
  html:not([data-theme="dark"]) .team span { color: var(--muted); }

  html:not([data-theme="dark"]) .drum-viewport::after{background:linear-gradient(to top,var(--surface2) 0%,transparent 100%);}
  html:not([data-theme="dark"]) .drum-face-type{color:var(--text);text-shadow:none;}

  /* ── MOBILE ─────────────────────────────────────────────── */

  }

<script>
// ── TEST FLAG — remove this block when done testing ───────
const TEST_FAN_VOTES = true; // random weight 13–27, unlimited re-votes
// ──────────────────────────────────────────────────────────

// ── INIT ──────────────────────────────────────────────────
let currentUser = getCurrentUser();

// State
let selId=null;
const rated=new Set();
let filter='all', lbMode='neutral';
let currentGW = 1; // updated from Supabase on load
let currentComp = 'PL';
let currentSeason = '2025';

const COMP_NAMES = {
  PL: 'Premier League', WC: 'FIFA World Cup', CL: 'UEFA Champions League',
  ELC: 'Championship', EC: 'European Championship', PD: 'La Liga',
  BL1: 'Bundesliga', SA: 'Serie A', FL1: 'Ligue 1', PPL: 'Primeira Liga',
};
function compLabel() { return COMP_NAMES[currentComp] || currentComp; }
function roundLabel(gw) {
  if (currentComp !== 'WC') return `Matchweek ${gw}`;
  if (gw <= 3) return `Group Stage · Round ${gw}`;
  const rounds = { 4:'Round of 32', 5:'Round of 16', 6:'Quarter-Finals', 7:'Semi-Finals', 8:'Third Place', 9:'Final' };
  return rounds[gw] || `Round ${gw}`;
}

const DESCS = RATING_DESCS;

// ── HEADER ────────────────────────────────────────────────
function initHeader() {
  if (!currentUser) {
    document.getElementById('ucName').textContent = 'Login';
    document.getElementById('ucAvatar').textContent = '→';
    document.getElementById('userChip').addEventListener('click', () => { window.location.href = 'login.html'; }, { once: true });
    return;
  }
  document.querySelectorAll('.auth-only').forEach(el => el.style.display = '');
  const team = PL_TEAMS.find(t => t.name === currentUser?.team);
  applyUserAvatar(document.getElementById('ucAvatar'), currentUser);
  document.getElementById('ucName').textContent = currentUser?.username || 'Guest';
  if (isAdmin(currentUser)) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  document.getElementById('ucTeamEmoji').innerHTML = '';
  document.getElementById('ddName').textContent = currentUser?.username || 'Guest';
  document.getElementById('ddTeam').innerHTML = team ? `${flagImg(team.emoji, 16)} ${team.name} supporter` : currentUser?.team ? `${currentUser.team} supporter` : 'No team selected';
  if (PREVIEW_MODE) {
    const badge = document.createElement('div');
    badge.className = 'preview-badge'; badge.textContent = 'Preview Mode';
    document.getElementById('userChip').insertBefore(badge, document.getElementById('userChip').firstChild);
  }
}

document.getElementById('userChip').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('userDropdown').classList.toggle('open');
});
document.getElementById('hamburger').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('mobileNav').classList.toggle('open');
});
document.addEventListener('click', () => {
  document.getElementById('userDropdown').classList.remove('open');
  document.getElementById('mobileNav').classList.remove('open');
});
document.getElementById('ddLogout').addEventListener('click', async () => {
  if (PREVIEW_MODE) { toast('Login is disabled in Preview Mode'); return; }
  await clearCurrentUser();
  window.location.href = 'login.html';
});

// ── TOAST ─────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── FLAG IMAGE HELPER ─────────────────────────────────────
function flagImg(emoji) {
  const codepoints = [...emoji]
    .map(c => c.codePointAt(0))
    .filter(cp => cp !== 0xFE0F)
    .map(cp => cp.toString(16))
    .join('-');
  return `<img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${codepoints}.svg" width="22" height="22" style="vertical-align:middle" alt="${emoji}">`;
}

// ── MATCH LIST ────────────────────────────────────────────
function renderList() {
  document.getElementById('matchSectionTitle').textContent = `${compLabel()} · ${roundLabel(currentGW)}`;
  const el = document.getElementById('matchList');
  const gwFiltered = MATCHES
    .filter(m => m.matchweek === currentGW)
    .sort((a, b) => {
      const ta = a.kickoff ? new Date(String(a.kickoff).replace(' ','T').replace(/Z$/,'')) : Infinity;
      const tb = b.kickoff ? new Date(String(b.kickoff).replace(' ','T').replace(/Z$/,'')) : Infinity;
      return ta - tb;
    });
  const list = filter==='all' ? gwFiltered : gwFiltered.filter(m=>m.status===(filter==='recent'?'complete':filter));

      <div class="match-body">

        <div class="score-block">${ref?ref.name:'<span style="color:var(--muted);font-size:1rem">Referee TBC</span>'}<span class="time"${live?' style="color:var(--red)"':''}>${live?'LIVE':up?(m.kickoff?new Date(String(m.kickoff).replace(' ','T').replace(/Z$/,'')).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).replace(',',''):'TBC'):'FT'}</span></div>
        <div class="team away"><div class="team-badge">${m.awayCrest?`<img src="${m.awayCrest}" style="width:26px;height:26px;object-fit:contain;" onerror="this.src='images/logos/RRLogo.svg';this.style.opacity='.7';">`:`<img src="images/logos/RRLogo.svg" style="width:22px;height:22px;opacity:.7;">`}</div><span>${m.away}</span></div>
      </div>
      ${!up?`<div class="card-stats" style="padding:0 16px 6px">
        <span class="stat-pill yc"><span class="icon">🟨</span>${m.yc}</span>
        ${m.rc?`<span class="stat-pill rc"><span class="icon">🟥</span>${m.rc}</span>`:''}
        ${m.pen?`<span class="stat-pill">${m.pen > 1 ? m.pen + 'x ' : ''}PEN</span>`:''}
        ${m.var?`<span class="stat-pill"><span class="icon">📺</span>VAR×${m.var}</span>`:''}

      ${(m.highlightVideoId||m.varVideoId)&&!up?`<div class="match-video-btns">

        ${m.varVideoId?`<button class="vid-btn var" data-vid="${m.varVideoId}" data-type="var">📺 VAR Decisions</button>`:''}
      </div>
      <div class="match-video-player" id="vp-${m.id}">
        <div class="match-video-player-inner" id="vpi-${m.id}"></div>
      </div>`:''}
      <div class="match-footer">
        <div class="ref-row">
          <div class="footer-score">${up ? '–' : m.score}</div>
          ${ref ? (!up && rated.has(+m.id) ? `<span style="font-size:.7rem;color:var(--pl-green);font-weight:600;pointer-events:none">Rated ✓</span>` : `<button class="rate-ref-btn">Rate this Ref</button>`) : ''}
        </div>
        ${!up&&ref?`<div class="vote-split">
          <div class="vote-bucket nb"><div><div class="vb-label nl">Neutral</div><div class="vb-stars">${nStars}</div></div><div><div class="vb-score ${hasN?'ns':'na'}">${hasN?ref.neutralRating.toFixed(1):'–'}</div><div class="vb-count">${ref.neutralVotes} votes</div></div></div>
          <div class="vote-bucket fb"><div><div class="vb-label fl">Fan</div><div class="vb-stars">${fStars}</div></div><div><div class="vb-score ${hasF?'fs':'na'}">${hasF?ref.fanRating.toFixed(1):'–'}</div><div class="vb-count">${ref.fanVotes} votes</div></div></div>
        </div>`:''}

  el.innerHTML = cards.join('');
}

// ── INLINE PANEL STATE ────────────────────────────────────
let matchIncidents = [];
let incidentVoteTotals = { neutral: {}, fan: {} };
let myIncidentVotes = {};
let drumState = { index: 0, incidents: [], myVotes: {}, mid: null, _updateFaces: null, _syncUI: null, _N: 0 };

// ── LIVE CARD + INCIDENT AUTO-SYNC ────────────────────────
// Fetches per-match detail for every live/complete match in the current GW.
// Live matches are synced every poll; complete matches are fetched once and cached.
// cardCache survives loadFromSheets/loadMatchStats rebuilds so values persist between polls.
// For admin users, also auto-saves new Yellow Card / Red Card /
// Penalty Given incidents to Supabase so the drum wheel populates.
const cardCache = {}; // matchId → {yc, rc, pen}
async function autoSyncLiveCards() {
  // Re-apply cached values after any MATCHES rebuild (loadFromSheets resets yc/rc/pen to 0)
  for (const [id, cards] of Object.entries(cardCache)) {
    const idx = MATCHES.findIndex(m => String(m.id) === id);
    if (idx !== -1) MATCHES[idx] = { ...MATCHES[idx], ...cards };
  }

  const toSync = MATCHES.filter(m =>
    +m.matchweek === +currentGW &&
    (m.status === 'live' || (m.status === 'complete' && !cardCache[m.id]))
  );
  if (!toSync.length) return;
  const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  for (const lm of toSync) {
    try {
      const url = isLocalDev ? `/api/matches/${lm.id}` : `/.netlify/functions/fd-match?id=${lm.id}`;
      const dr = await fetch(url);
      if (!dr.ok) continue;
      const detail   = await dr.json();
      const bookings = detail.bookings || [];
      const goals    = detail.goals    || [];
      const yc  = bookings.filter(b => b.card === 'YELLOW_CARD').length;
      const rc  = bookings.filter(b => b.card === 'RED_CARD' || b.card === 'YELLOW_RED_CARD').length;
      const pen = goals.filter(g => g.type === 'PENALTY').length;
      cardCache[lm.id] = { yc, rc, pen };
      const idx = MATCHES.findIndex(m => m.id === lm.id);
      if (idx !== -1) MATCHES[idx] = { ...MATCHES[idx], yc, rc, pen };

      // Persist to RTR Match Stats so card counts survive page reloads.
      // Only write if the API actually returned a bookings array — if it's
      // missing entirely the free tier isn't providing card data for this match
      // and we'd risk overwriting anything entered manually.
      if (Array.isArray(detail.bookings)) {
        saveMatchStat({ match_id: lm.id, yellow_cards: yc, red_cards: rc, penalties_given: pen })
          .catch(e => console.warn('[RTR] failed to persist card stats:', e));
      }

      if (isAdmin()) {
        const existing = await loadIncidents(lm.id);
        const ycBook   = bookings.filter(b => b.card === 'YELLOW_CARD');
        const rcBook   = bookings.filter(b => b.card === 'RED_CARD' || b.card === 'YELLOW_RED_CARD');
        const penGoal  = goals.filter(g => g.type === 'PENALTY');
        const exYC  = existing.filter(i => i.type === 'Yellow Card').length;
        const exRC  = existing.filter(i => i.type === 'Red Card').length;
        const exPen = existing.filter(i => i.type === 'Penalty Given').length;

        const created = [];
        for (let i = exYC; i < ycBook.length; i++) {
          const b = ycBook[i];
          const inc = await saveIncident(lm.id, 'Yellow Card', b.minute ?? null, b.player?.name ?? null);
          if (inc) created.push(inc);
        }
        for (let i = exRC; i < rcBook.length; i++) {
          const b = rcBook[i];
          const inc = await saveIncident(lm.id, 'Red Card', b.minute ?? null, b.player?.name ?? null);
          if (inc) created.push(inc);
        }
        for (let i = exPen; i < penGoal.length; i++) {
          const g = penGoal[i];
          const inc = await saveIncident(lm.id, 'Penalty Given', g.minute ?? null, g.scorer?.name ?? null);
          if (inc) created.push(inc);
        }

        if (created.length && selId && +selId === lm.id) {
          const allInc = [...existing, ...created];
          const ids = allInc.map(i => i.id);
          const [voteSplit, myVotes] = await Promise.all([
            loadIncidentVotes(ids),
            loadMyIncidentVotes(currentUser?.id, ids),
          ]);
          matchIncidents     = allInc;
          incidentVoteTotals = voteSplit;
          Object.assign(myIncidentVotes, myVotes);
          drumState.incidents = allInc;
          drumState._N        = allInc.length;
        }
      }
    } catch(e) {
      console.warn('[RTR] autoSyncLiveCards failed:', lm.home, 'v', lm.away, e);
    }
  }
}

function getInlineEl(mid) { return document.getElementById(`inline-${mid}`); }

function closeInline(silent = false) {
  if (!selId) return;
  const el = getInlineEl(selId);
  if (el) el.classList.remove('open');
  selId = null;
  matchIncidents = []; incidentVoteTotals = { neutral:{}, fan:{} }; myIncidentVotes = {};
  drumState = { index:0, incidents:[], myVotes:{}, mid:null, _updateFaces:null, _syncUI:null, _N:0 };
  if (!silent) renderList();
}

async function toggleInline(mid) {
  if (selId === mid) { closeInline(); return; }
  if (selId) { const prev = getInlineEl(selId); if (prev) prev.classList.remove('open'); selId = null; }
  selId = mid;
  renderList();
  const el = getInlineEl(mid);
  if (!el) return;
  el.classList.add('open');
  el.innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.82rem;text-align:center">Loading…</div>`;
  await loadAndRenderInline(mid);
}

async function loadAndRenderInline(mid) {
  const el = getInlineEl(mid);
  if (!el || !el.classList.contains('open')) return;
  const m = MATCHES.find(x => x.id === +mid);
  if (!m) { el.innerHTML = ''; return; }
  const ref = REFS.find(r => +r.id === +m.refId) || null;
  const isUpcoming = m.status === 'upcoming' && !TEST_FAN_VOTES;
  if (!isUpcoming) {
    matchIncidents = await loadIncidents(mid);
    const ids = matchIncidents.map(i => i.id);
    const [voteSplit, myVotes] = await Promise.all([
      loadIncidentVotes(ids),
      TEST_FAN_VOTES ? Promise.resolve({}) : loadMyIncidentVotes(currentUser?.id, ids),
    ]);
    incidentVoteTotals = voteSplit; myIncidentVotes = myVotes;
  } else {
    matchIncidents = []; incidentVoteTotals = { neutral:{}, fan:{} }; myIncidentVotes = {};
  }
  drumState = { index:0, incidents:matchIncidents, myVotes:myIncidentVotes, mid, _updateFaces:null, _syncUI:null, _N:matchIncidents.length };
  renderInlinePanel(mid, m, ref, isUpcoming);
}

function renderInlinePanel(mid, m, ref, isUpcoming) {
  const el = getInlineEl(mid);
  if (!el) return;
  const needed = Math.ceil(MIN_VOTES / VOTE_MULTIPLIER);
  const nScore = isUpcoming ? null : calcIncidentScore(matchIncidents, incidentVoteTotals.neutral);
  const fScore = isUpcoming ? null : calcIncidentScore(matchIncidents, incidentVoteTotals.fan);
  const nVotes = isUpcoming ? 0 : Object.values(incidentVoteTotals.neutral).reduce((s,v)=>s+v.correct+v.wrong,0);
  const fVotes = isUpcoming ? 0 : Object.values(incidentVoteTotals.fan).reduce((s,v)=>s+v.correct+v.wrong,0);

  function scoreTile(score, votes, type) {
    const lbl = type==='n' ? 'Neutral Rating' : 'Fan Rating';
    const cls = type==='n' ? 'nl' : 'fl';
    const sc  = score!==null ? (score>=7?'g':score>=5?'y':'r') : '';
    const val = score!==null
      ? `<div class="inc-tile-val ${sc}" data-score="${type}-val">${score.toFixed(1)}<span class="inc-tile-denom">/10</span></div>`
      : `<div class="inc-tile-val pending" data-score="${type}-val">${votes?`${votes}/${needed}`:'Pending'}</div>`;
    return `<div class="inc-score-tile"><div class="inc-tile-label ${cls}">${lbl}</div>${val}<div class="inc-tile-sub" data-score="${type}-sub">${!isUpcoming?votes+' vote'+(votes!==1?'s':''):''}</div></div>`;
  }

  const drumHTML = (!isUpcoming && matchIncidents.length) ? `
    <div class="drum-section" id="drum-${mid}">
      <div class="drum-section-hdr">
        <span class="drum-section-lbl">Decisions</span>
        <span class="drum-counter" id="drum-counter-${mid}">1 of ${matchIncidents.length}</span>
      </div>
      <div class="drum-outer">
        <div class="drum-viewport" id="drum-vp-${mid}">
          <div class="drum-center-highlight"></div>
          ${matchIncidents.map((inc,i) => buildDrumFace(inc,i)).join('')}
        </div>
        <div class="drum-controls">
          <div class="drum-arrows">
            <button class="drum-arrow" id="drum-up-${mid}" data-drum-up="${mid}" disabled>▲</button>
            <button class="drum-arrow" id="drum-dn-${mid}" data-drum-dn="${mid}" ${matchIncidents.length<=1?'disabled':''}>▼</button>
          </div>
          <span class="drum-hint">drag or tap to scroll</span>
        </div>
      </div>
      <div class="drum-vote-section" id="drum-vote-btns-${mid}">${buildVoteBtnsHTML(mid,0)}</div>
    </div>` : (!isUpcoming ? `<div class="inc-empty" style="margin:12px 16px">No decisions logged yet for this match</div>` : '');

  el.innerHTML = `
    <div class="inline-ref-bar">
      <div class="rcard-av" style="width:36px;height:36px;font-size:.85rem;flex-shrink:0;overflow:hidden">${ref ? refAvatarHtml(ref, 36) : '?'}</div>
      <div style="flex:1"><div class="rcard-name">${ref ? ref.name : 'Referee TBC'}</div><div class="rcard-meta">${ref ? (ref.nationality||'') : ''}</div></div>
    </div>
    ${!isUpcoming?`<div class="inline-score-tiles">${scoreTile(nScore,nVotes,'n')}${scoreTile(fScore,fVotes,'f')}</div>`:''}
    ${!isUpcoming?`<div style="padding:10px 16px 0"><button class="inc-flag-btn" data-flag-mid="${mid}">⚑ Flag an Incorrect Decision</button></div>`:''}
    ${isUpcoming?`<div class="inc-pregame" style="margin:12px 16px"><div class="inc-pregame-icon">🔒</div><div class="inc-pregame-title">Match hasn't started yet</div><div class="inc-pregame-sub">Voting opens once the game kicks off</div></div>`:''}
    ${drumHTML}
    ${!isUpcoming?`<div class="inline-discuss" data-match-title="${m.home} vs ${m.away}" data-matchweek="${m.matchweek||''}">
      <div class="inline-discuss-label">💬 Match Discussion</div>
      <textarea class="inline-discuss-input" placeholder="Share your thoughts…" rows="3" maxlength="1000"></textarea>
      <button class="inline-discuss-send">Post to Forum</button>
      <div class="inline-discuss-link"></div>
    </div>`:''}`;

  if (!isUpcoming && matchIncidents.length) initDrum(mid);

  if (!isUpcoming) {
    const discussEl = el.querySelector('.inline-discuss');
    if (discussEl) {
      findMatchForumThread(`${m.home} vs ${m.away}`).then(thread => {
        const linkEl = discussEl.querySelector('.inline-discuss-link');
        if (linkEl) linkEl.innerHTML = thread
          ? `Thread open — <a href="forum.html">view in Forum</a>`
          : `Posts here will appear in <a href="forum.html">Forum → Games</a>`;
      });
    }
  }
}

function buildDrumFace(inc, index) {
  const myVote = myIncidentVotes[inc.id]?.vote || null;
  const parts = (inc.description || '').split('||');
  const player  = parts[0]?.trim() || '';
  const outcome = parts[1]?.trim() || '';
  const outcomeColour = parts[2]?.trim() === 'purple' ? '#c064c0' : 'var(--pl-green)';
  const pill = myVote ? `<span class="drum-voted-pill v-${myVote}">${myVote==='correct'?'✓ Correct':'✗ Wrong'}</span>` : '';
  return `<div class="drum-face dim" data-drum-index="${index}" data-inc-id="${inc.id}">
    <div class="drum-face-type">${inc.type}${inc.minute!=null?` <span class="inc-minute">${inc.minute}'</span>`:''}</div>
    ${player?`<div class="drum-face-detail">${player}</div>`:''}
    ${outcome?`<div class="drum-face-outcome" style="color:${outcomeColour}">${outcome}</div>`:''}
    ${pill}
  </div>`;
}

function buildVoteBtnsHTML(mid, index) {
  const inc = drumState.incidents[index];
  if (!inc) return '';
  const myVote = drumState.myVotes[inc.id]?.vote || null;
  return `
    <button class="drum-vote-btn correct${myVote==='correct'?' active':''}" data-drum-vote="correct" data-iid="${inc.id}" data-mid="${mid}">
      <span class="dvb-icon">✅</span>Correct
    </button>
    <button class="drum-vote-btn wrong${myVote==='wrong'?' active':''}" data-drum-vote="wrong" data-iid="${inc.id}" data-mid="${mid}">
      <span class="dvb-icon">✗</span>Incorrect
    </button>`;
}

function initDrum(mid) {
  const vp = document.getElementById(`drum-vp-${mid}`);
  if (!vp) return;
  const faceH = 52, vpH = 156, N = drumState.incidents.length;
  const centerY = (vpH - faceH) / 2;

  function updateFaces(fracIdx, animate) {
    vp.querySelectorAll('.drum-face').forEach((f, i) => {
      const dist = i - fracIdx;
      const absD = Math.abs(dist);
      const y    = centerY + dist * faceH;
      const rx   = dist * 22;
      const sc   = Math.max(0.65, 1 - absD * 0.1);
      const op   = Math.max(0.1,  1 - absD * 0.38);
      f.style.transition = animate ? 'transform .32s cubic-bezier(.25,.46,.45,.94),opacity .32s' : 'none';
      f.style.transform  = `translateY(${y}px) rotateX(${rx}deg) scale(${sc})`;
      f.style.opacity    = op;
    });
  }

  function syncUI(idx) {
    const ctr = document.getElementById(`drum-counter-${mid}`);
    if (ctr) ctr.textContent = `${idx+1} of ${N}`;
    const up = document.getElementById(`drum-up-${mid}`);
    const dn = document.getElementById(`drum-dn-${mid}`);
    if (up) up.disabled = idx === 0;
    if (dn) dn.disabled = idx === N - 1;
    const vb = document.getElementById(`drum-vote-btns-${mid}`);
    if (vb) vb.innerHTML = buildVoteBtnsHTML(mid, idx);
  }

  updateFaces(0, false);
  syncUI(0);
  drumState._updateFaces = updateFaces;
  drumState._syncUI = syncUI;
  drumState._N = N;

  let startY = null, startIdx = null, dragging = false;
  vp.addEventListener('pointerdown', e => {
    startY = e.clientY; startIdx = drumState.index; dragging = true;
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => {
    if (!dragging) return;
    const frac = startIdx - (e.clientY - startY) / faceH;
    updateFaces(Math.max(-0.6, Math.min(N - 0.4, frac)), false);
  });
  vp.addEventListener('pointerup', e => {
    if (!dragging) return; dragging = false;
    drumState.index = Math.max(0, Math.min(N - 1, Math.round(startIdx - (e.clientY - startY) / faceH)));
    updateFaces(drumState.index, true);
    syncUI(drumState.index);
  });
  vp.addEventListener('pointercancel', () => {
    if (!dragging) return; dragging = false;
    updateFaces(drumState.index, true);
  });
}

async function handleDrumVote(btn) {
  const incidentId = btn.dataset.iid;
  const vote = btn.dataset.drumVote;
  const mid  = +btn.dataset.mid;
  const voteMatch = MATCHES.find(x => x.id===mid);
  const isFan = voteMatch && isFanMatch(voteMatch, currentUser);
  const bucket = isFan ? 'fan' : 'neutral';
  const voteWeight = TEST_FAN_VOTES ? Math.floor(Math.random()*15)+13 : 5;

  const oldVote = drumState.myVotes[incidentId]?.vote;
  if (oldVote && incidentVoteTotals[bucket][incidentId]) {
    incidentVoteTotals[bucket][incidentId][oldVote] = Math.max(0,(incidentVoteTotals[bucket][incidentId][oldVote]||0)-voteWeight);
  }
  if (!incidentVoteTotals[bucket][incidentId]) incidentVoteTotals[bucket][incidentId]={correct:0,wrong:0};
  incidentVoteTotals[bucket][incidentId][vote]=(incidentVoteTotals[bucket][incidentId][vote]||0)+voteWeight;
  drumState.myVotes[incidentId]={vote}; myIncidentVotes[incidentId]={vote};

  const face = document.querySelector(`.drum-face[data-inc-id="${incidentId}"]`);
  if (face) {
    let pill = face.querySelector('.drum-voted-pill');
    if (!pill) { pill=document.createElement('span'); face.appendChild(pill); }
    pill.className=`drum-voted-pill v-${vote}`;
    pill.textContent=vote==='correct'?'✓ Correct':'✗ Wrong';
  }
  const vb = document.getElementById(`drum-vote-btns-${mid}`);
  if (vb) vb.innerHTML=buildVoteBtnsHTML(mid, drumState.index);
  updateInlineScores(mid);

  const ok = await saveIncidentVote(incidentId, currentUser?.id, vote, isFan, voteWeight);
  if (!ok) { toast('⚠ Vote failed — please try again'); return; }
  toast(`${vote==='correct'?'✅ ':''} Vote recorded as ${isFan?'Fan':'Neutral'}!`.trim());
  const ref = REFS.find(r=>r.id===+voteMatch.refId);
  if (ref) {
    const ns=calcIncidentScore(matchIncidents,incidentVoteTotals.neutral);
    const fs=calcIncidentScore(matchIncidents,incidentVoteTotals.fan);
    if(ns!==null) ref.neutralRating=ns;
    if(fs!==null) ref.fanRating=fs;
    renderLb();
  }
  if (currentUser?.id) checkVotingBadges(currentUser.id).catch(()=>{});
}

function updateInlineScores(mid) {
  const el = getInlineEl(mid);
  if (!el) return;
  const needed = Math.ceil(MIN_VOTES/VOTE_MULTIPLIER);
  const nScore = calcIncidentScore(matchIncidents, incidentVoteTotals.neutral);
  const fScore = calcIncidentScore(matchIncidents, incidentVoteTotals.fan);
  const nVotes = Object.values(incidentVoteTotals.neutral).reduce((s,v)=>s+v.correct+v.wrong,0);
  const fVotes = Object.values(incidentVoteTotals.fan).reduce((s,v)=>s+v.correct+v.wrong,0);
  function upd(vSel, sSel, score, votes) {
    const vEl=el.querySelector(`[data-score="${vSel}"]`);
    const sEl=el.querySelector(`[data-score="${sSel}"]`);
    if(!vEl) return;
    if(score===null){ vEl.textContent=votes?`${votes}/${needed}`:'Pending'; vEl.className='inc-tile-val pending'; if(sEl) sEl.textContent=votes?`${votes} vote${votes!==1?'s':''} · need ${needed} to unlock`:`Need ${needed} votes`; }
    else { const sc=score>=7?'g':score>=5?'y':'r'; vEl.innerHTML=`${score.toFixed(1)}<span class="inc-tile-denom">/10</span>`; vEl.className=`inc-tile-val ${sc}`; if(sEl) sEl.textContent=`${votes} vote${votes!==1?'s':''}`; }
  }
  upd('n-val','n-sub',nScore,nVotes);
  upd('f-val','f-sub',fScore,fVotes);
}

function reopenInlineAfterRender() {
  if (!selId) return;
  const el = getInlineEl(selId);
  if (!el) return;
  el.classList.add('open');
  const m   = MATCHES.find(x=>x.id===+selId);
  const ref = REFS.find(r=>r.id===+m?.refId);
  if (!m || !ref) return;
  const savedIndex = drumState.index;
  renderInlinePanel(selId, m, ref, m.status==='upcoming'&&!TEST_FAN_VOTES);
  if (savedIndex > 0 && drumState._updateFaces && drumState._syncUI) {
    drumState.index = savedIndex;
    drumState._updateFaces(savedIndex, false);
    drumState._syncUI(savedIndex);
  }
}

// ── LEADERBOARD ───────────────────────────────────────────
function renderLb(){
  const sorted=[...REFS].filter(r => (lbMode==='neutral' ? r.neutralVotes : r.fanVotes) > 0).sort((a,b)=>{
    const av=lbMode==='neutral'?a.neutralVotes:a.fanVotes, bv=lbMode==='neutral'?b.neutralVotes:b.fanVotes;
    const ar=lbMode==='neutral'?a.neutralRating:a.fanRating, br=lbMode==='neutral'?b.neutralRating:b.fanRating;
    if(!av&&!bv)return 0; if(!av)return 1; if(!bv)return -1; return br-ar;
  });
  if (!sorted.length) { document.getElementById('leaderboard').innerHTML = `<div style="padding:16px;color:var(--muted);font-size:.82rem;text-align:center">No ${lbMode} votes yet</div>`; return; }
  document.getElementById('leaderboard').innerHTML=sorted.map((ref,i)=>{
    const votes=lbMode==='neutral'?ref.neutralVotes:ref.fanVotes, rating=lbMode==='neutral'?ref.neutralRating:ref.fanRating;
    const sc=rating>=7.5?'g':rating>=6?'y':'r';
    return`<div class="lb-row" data-lref="${ref.id}"><div class="lb-rank${i<3?' top':''}">${i+1}</div><div><div class="lb-ref-name">${ref.name}</div><div class="lb-games">${votes} votes · all time</div></div><div class="lb-score ${sc}">${rating != null ? rating.toFixed(1) : '–'}</div></div>`;
  }).join('');
}

document.getElementById('matchList').addEventListener('click', e => {
  if (e.target.closest('.vid-btn')) return;

    if (drumState.index > 0 && drumState._updateFaces && drumState._syncUI) {
      drumState.index--;

    }

  }

    e.stopPropagation();

      drumState.index++;
      drumState._updateFaces(drumState.index, true);
      drumState._syncUI(drumState.index);
    }
    return;
  }
  const voteBtn = e.target.closest('[data-drum-vote]');

    e.stopPropagation();
    const mid = +flagBtn.dataset.flagMid;
    const m = MATCHES.find(x=>x.id===mid);
    let mm=null;
    if(m?.kickoff){const ko=new Date(String(m.kickoff).replace(' ','T')).getTime();const el=Math.floor((Date.now()-ko)/60000);if(el>=0&&el<=130)mm=Math.min(130,el);}
    if(mid&&currentUser?.id) saveDecisionFlag(mid,mm).catch(()=>{});
    document.getElementById(`drum-${mid}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});

  }
  const sendBtn = e.target.closest('.inline-discuss-send');

    e.stopPropagation();

      if (result) { if(input) input.value=''; toast('💬 Posted to Forum!'); if(linkEl) linkEl.innerHTML=`Thread live — <a href="forum.html">view in Forum → Games</a>`; }

      sendBtn.disabled=false;

  }

// ── API FIXTURE LOADER (inline — bypasses shared.js cache) ───
async function loadMatchesFromAPI(gw, comp = currentComp, season = currentSeason) {
  const isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  const url = isLocal
    ? `/api/fd-matches?matchday=${gw}&season=${season}&comp=${comp}`
    : `/.netlify/functions/fd-matches?matchday=${gw}&season=${season}&comp=${comp}`;
  console.log('[RTR] loadMatchesFromAPI → GW', gw, comp, season, '→', url);
  try {
    const res  = await fetch(url);
    if (!res.ok) { console.warn('[RTR] API returned', res.status, 'for', url); return false; }
    const data = await res.json();
    const fdMatches = data.matches;
    if (!fdMatches?.length) { console.warn('[RTR] API returned 0 matches for GW', gw); return false; }
    const FD_STATUS = { FINISHED:'complete', IN_PLAY:'live', PAUSED:'live', HALF_TIME:'live', TIMED:'upcoming', SCHEDULED:'upcoming', SUSPENDED:'upcoming', POSTPONED:'upcoming', CANCELLED:'upcoming' };
    MATCHES = fdMatches.map(fm => {
      const ft = fm.score?.fullTime;
      const hasScore = ft?.home != null && ft?.away != null && (fm.status === 'FINISHED' || fm.status === 'IN_PLAY' || fm.status === 'PAUSED' || fm.status === 'HALF_TIME');
      const apiRef = (fm.referees||[]).find(r => r.type==='REFEREE');
      const apiRefName = (apiRef?.name||'').toLowerCase();
      const ref = apiRefName ? REFS.find(r =>
        r.name.toLowerCase() === apiRefName ||
        apiRefName.includes(r.name.split(' ').pop().toLowerCase())
      ) : null;
      return {
        id: fm.id, matchweek: fm.matchday,
        home: fm.homeTeam?.shortName || fm.homeTeam?.name || '',
        away: fm.awayTeam?.shortName || fm.awayTeam?.name || '',
        hE: '', aE: '',
        kickoff:   fm.utcDate || null,
        status:    FD_STATUS[fm.status] || 'upcoming',
        score:     hasScore ? `${ft.home}-${ft.away}` : '–',
        refId:     ref?.id || null,
        homeCrest: fm.homeTeam?.crest || null,
        awayCrest: fm.awayTeam?.crest || null,
        yc: 0, rc: 0, pen: 0, var: 0,
        perfectGame: false, incorrectVarPen: 0, incorrectVarRed: 0,
        highlightVideoId: null, varVideoId: null,
      };
    });
    console.log('[RTR] Matches loaded from API:', MATCHES.length, 'for GW', gw);
    return true;
  } catch(e) {
    console.warn('[RTR] API fixture load failed:', e);
    return false;
  }
}

initHeader();
(async () => {
  document.getElementById('matchList').innerHTML = Array(6).fill(skelMatchCard()).join('');
  document.getElementById('leaderboard').innerHTML = Array(5).fill(`<div class="skel-card" style="display:flex;align-items:center;gap:12px"><div class="skel skel-circle" style="width:28px;height:28px;flex-shrink:0"></div><div style="flex:1"><div class="skel skel-line" style="width:60%;margin-bottom:6px"></div><div class="skel skel-line" style="width:40%"></div></div><div class="skel skel-line" style="width:32px;height=20px;border-radius:6px"></div></div>`).join('');
  if (!PREVIEW_MODE) {
    await checkAuth().catch(() => {});
    currentUser = getCurrentUser();
  }
  const gwConfig = await loadGWConfig();
  if (gwConfig) {
    currentGW = gwConfig.gw;
    currentComp = gwConfig.comp || 'PL';
    currentSeason = gwConfig.season || '2025';
  }
  await loadFromSheets().catch(() => {}); // loads REFS only (fixtures overridden below)
  await loadMatchesFromAPI(currentGW);    // overwrites MATCHES with live API data
  const stats = await loadMatchStats().catch(() => []);
  if (stats.length) {
    const overrideMap = Object.fromEntries(stats.map(o => [+o.match_id, o]));
    MATCHES = MATCHES.map(m => {
      const o = overrideMap[+m.id];
      if (!o) return m;
      const derivedStatus = o.status ?? m.status;
      return { ...m,
        score: derivedStatus === 'live' ? m.score : (o.score ?? m.score),
        status: derivedStatus,
        yc: o.yellow_cards ?? m.yc, rc: o.red_cards ?? m.rc,
        pen: o.penalties_given ?? m.pen, var: o.var_decisions ?? m.var,
        perfectGame: o.perfect_game ?? m.perfectGame,
        incorrectVarPen: o.incorrect_var_pen ?? m.incorrectVarPen,
        incorrectVarRed: o.incorrect_var_red ?? m.incorrectVarRed,
        refId: o.ref_id ?? m.refId,
        highlightVideoId: o.highlight_video_id ?? m.highlightVideoId,
        varVideoId: o.var_video_id ?? m.varVideoId,
      };
    });
  }
  const gwMatchIds = MATCHES.filter(m => +m.matchweek === +currentGW).map(m => +m.id);
  await Promise.all([
    loadIncidentRatings(gwMatchIds), // per-GW scores only
    loadUserVotes(currentUser?.id, gwMatchIds).then(v => v.forEach(id => rated.add(id)))
  ]);
  syncMatchStatuses();
  initHeader();
  updatePanelVisibility();
  renderList();
  renderLb();
  autoSyncLiveCards().then(() => { renderList(); renderLb(); }).catch(() => {});
  // Reload sheet data + re-check statuses every minute so changes propagate without a page refresh
  setInterval(async () => {
    await loadFromSheets().catch(() => {}); // refreshes REFS
    await loadMatchesFromAPI(currentGW);    // re-fetches live scores from API
    const refreshStats = await loadMatchStats().catch(() => []);
    if (refreshStats.length) {
      const rm = Object.fromEntries(refreshStats.map(o => [+o.match_id, o]));
      MATCHES = MATCHES.map(m => {
        const o = rm[+m.id]; if (!o) return m;
        const derivedStatus = o.status ?? m.status;
        return { ...m,
          score: derivedStatus === 'live' ? m.score : (o.score ?? m.score),
          status: derivedStatus,
          yc: o.yellow_cards ?? m.yc, rc: o.red_cards ?? m.rc,
          pen: o.penalties_given ?? m.pen, var: o.var_decisions ?? m.var,
          perfectGame: o.perfect_game ?? m.perfectGame,
          incorrectVarPen: o.incorrect_var_pen ?? m.incorrectVarPen,
          incorrectVarRed: o.incorrect_var_red ?? m.incorrectVarRed,
          refId: o.ref_id ?? m.refId,
          highlightVideoId: o.highlight_video_id ?? m.highlightVideoId,
          varVideoId: o.var_video_id ?? m.varVideoId,
        };
      });
    }
    await autoSyncLiveCards().catch(() => {});
    const refreshIds = MATCHES.filter(m => +m.matchweek === +currentGW).map(m => +m.id);
    await loadIncidentRatings(refreshIds);
    syncMatchStatuses();
    // If a panel is open for a live/complete match, re-fetch its incidents so new decisions appear
    if (selId) {
      const openMatch = MATCHES.find(x => x.id === +selId);
      if (openMatch && openMatch.status !== 'upcoming') {
        try {
          const freshIncidents = await loadIncidents(selId);
          if (freshIncidents.length !== matchIncidents.length) {
            const ids = freshIncidents.map(i => i.id);
            const [voteSplit, myVotes] = await Promise.all([
              loadIncidentVotes(ids),
              TEST_FAN_VOTES ? Promise.resolve({}) : loadMyIncidentVotes(currentUser?.id, ids),
            ]);
            matchIncidents = freshIncidents;
            incidentVoteTotals = voteSplit;
            Object.assign(myIncidentVotes, myVotes);
            drumState.incidents = freshIncidents;
            drumState._N = freshIncidents.length;
          }
        } catch(e) {}
      }
    }
    renderList();
    reopenInlineAfterRender();
    renderLb();
  }, 3 * 60 * 1000);
})();
</script>
<script>
(function(){
  let activePlayer = null; // { mid, type } — tracks what's currently open

  document.getElementById('matchList').addEventListener('click', e => {
    const btn = e.target.closest('.vid-btn');
    if (!btn) return;
    e.stopPropagation(); // don't open the rating panel

    const card   = btn.closest('.match-card');
    const mid    = card?.dataset.mid;
    const type   = btn.dataset.type;
    const vid    = btn.dataset.vid;
    const player = document.getElementById(`vp-${mid}`);
    const inner  = document.getElementById(`vpi-${mid}`);
    if (!player || !inner) return;

    const isSame = activePlayer?.mid === mid && activePlayer?.type === type;

    // Close any currently open player
    if (activePlayer) {
      const prevPlayer = document.getElementById(`vp-${activePlayer.mid}`);
      const prevInner  = document.getElementById(`vpi-${activePlayer.mid}`);
      if (prevPlayer) prevPlayer.classList.remove('open');
      if (prevInner)  { prevInner.innerHTML = ''; } // stops playback
      document.querySelectorAll('.vid-btn').forEach(b => b.classList.remove('active'));
      activePlayer = null;
    }

    // If clicking the same button again — just close (toggle off)
    if (isSame) return;

    // Open the new player
    inner.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&rel=0"
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
    </iframe>`;
    player.classList.add('open');
    btn.classList.add('active');
    activePlayer = { mid, type };

    // Scroll the card into view smoothly
    setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  });
})();
</script>
