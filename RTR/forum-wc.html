<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RefRater">
<link rel="apple-touch-icon" href="/images/logos/RRlogo192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — World Cup Forum</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<style>
  body { background: var(--bg); }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 30%, rgba(55,0,60,.4) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 70%, rgba(0,60,0,.2) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ── WC HEADER ── */
  .wc-header {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .wc-badge {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #FFD700, #FFA500);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(255,215,0,.3);
  }
  .wc-title-block { flex: 1; }
  .wc-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 1.9rem; text-transform: uppercase;
    letter-spacing: 1px; color: #FFD700;
    line-height: 1;
  }
  .wc-subtitle {
    font-size: .78rem; color: var(--muted); margin-top: 2px;
    font-family: 'Barlow Condensed', sans-serif; letter-spacing: .5px;
    text-transform: uppercase;
  }
  .wc-new-btn {
    background: linear-gradient(135deg, #FFD700, #FFA500);
    color: #000; border: none; border-radius: 8px;
    padding: 9px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .9rem;
    letter-spacing: .5px; text-transform: uppercase;
    cursor: pointer; transition: opacity .15s; white-space: nowrap;
  }
  .wc-new-btn:hover { opacity: .85; }

  /* ── LAYOUT ── */
  .wc-layout { display: flex; gap: 18px; align-items: flex-start; }
  .wc-sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 0;
    position: sticky; top: 80px;
    max-height: calc(100vh - 110px); overflow-y: auto;
  }
  .wc-main { flex: 1; min-width: 0; }
  @media (max-width: 700px) {
    .wc-layout { flex-direction: column; }
    .wc-sidebar { width: 100%; position: static; max-height: 260px; }
  }

  /* ── SIDEBAR FIXTURES ── */
  .sb-comp-hdr {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .68rem; letter-spacing: 2px;
    text-transform: uppercase; color: #FFD700;
    padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .sb-date-hdr {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .62rem; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
    padding: 8px 14px 4px;
    border-top: 1px solid rgba(255,255,255,.05);
    margin-top: 2px;
  }
  .sb-date-hdr:first-of-type { border-top: none; margin-top: 0; }
  .sb-fixture {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; cursor: pointer;
    transition: background .12s;
    border-left: 2px solid transparent;
  }
  .sb-fixture:hover { background: rgba(255,255,255,.04); }
  .sb-fixture.active { border-left-color: #FFD700; background: rgba(255,215,0,.06); }
  .sb-teams { flex: 1; min-width: 0; }
  .sb-team-name {
    font-size: .74rem; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sb-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .78rem;
    color: #FFD700; flex-shrink: 0; min-width: 32px; text-align: center;
  }
  .sb-score.upcoming { color: var(--muted); font-size: .65rem; }

  /* ── CATEGORY TABS ── */
  .wc-cat-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .wc-cat-tab {
    background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .85rem;
    letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .wc-cat-tab.active, .wc-cat-tab:hover {
    border-color: #FFD700; color: #FFD700;
    background: rgba(255,215,0,.07);
  }

  /* ── SELECTED MATCH BANNER ── */
  .match-banner {
    background: linear-gradient(135deg, rgba(255,215,0,.08), rgba(255,165,0,.05));
    border: 1px solid rgba(255,215,0,.25); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .match-banner-teams {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 1.1rem; text-transform: uppercase;
    letter-spacing: .5px; color: #FFD700;
  }
  .match-banner-score {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 1.3rem; color: #fff;
    background: rgba(255,215,0,.12); border: 1px solid rgba(255,215,0,.25);
    border-radius: 6px; padding: 2px 10px;
  }
  .match-banner-clear {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: .9rem; padding: 4px;
    transition: color .15s; flex-shrink: 0;
  }
  .match-banner-clear:hover { color: var(--text); }

  /* ── COMPOSE ── */
  .compose-box {
    background: var(--surface2); border: 1px solid rgba(255,215,0,.3);
    border-radius: 14px; padding: 20px; margin-bottom: 20px; display: none;
  }
  .compose-box.open { display: block; }
  .compose-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 1rem; text-transform: uppercase;
    letter-spacing: .5px; color: #FFD700; margin-bottom: 14px;
  }
  .compose-row { margin-bottom: 10px; }
  .compose-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: inherit; font-size: .9rem; box-sizing: border-box;
    transition: border-color .15s;
  }
  .compose-input:focus { outline: none; border-color: #FFD700; }
  .compose-select {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text);
    font-family: inherit; font-size: .9rem; cursor: pointer; box-sizing: border-box;
  }
  .compose-textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; color: var(--text);
    font-family: inherit; font-size: .9rem; resize: vertical;
    min-height: 90px; box-sizing: border-box; transition: border-color .15s;
  }
  .compose-textarea:focus { outline: none; border-color: #FFD700; }
  .compose-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .compose-submit {
    background: linear-gradient(135deg, #FFD700, #FFA500); color: #000;
    border: none; border-radius: 8px; padding: 9px 20px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .9rem; letter-spacing: .5px;
    text-transform: uppercase; cursor: pointer; transition: opacity .15s;
  }
  .compose-submit:hover { opacity: .85; }
  .compose-cancel {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .9rem; cursor: pointer; transition: all .15s;
  }
  .compose-cancel:hover { border-color: var(--text); color: var(--text); }

  /* ── POST CARDS ── */
  .post-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    transition: border-color .15s;
  }
  .post-card:hover { border-color: rgba(255,215,0,.3); }
  .post-card.expanded { border-color: rgba(255,215,0,.5); }
  .post-head { padding: 14px 16px; cursor: pointer; }
  .post-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .post-author { font-size: .75rem; color: var(--muted); }
  .wc-pill {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
    font-size: .68rem; letter-spacing: .5px; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px;
  }
  .wc-pill.match { background: rgba(255,215,0,.12); color: #FFD700; border: 1px solid rgba(255,215,0,.3); }
  .wc-pill.decision { background: rgba(200,64,64,.12); color: #ef4444; border: 1px solid rgba(200,64,64,.3); }
  .wc-pill.general { background: rgba(156,163,175,.1); color: #9ca3af; border: 1px solid rgba(156,163,175,.2); }
  .post-subject {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 1.05rem;
    color: var(--text); margin-bottom: 4px;
  }
  .post-preview { font-size: .82rem; color: var(--muted); line-height: 1.4; }
  .post-footer {
    display: flex; align-items: center; padding: 8px 16px;
    border-top: 1px solid var(--border);
    font-size: .75rem; color: var(--muted); gap: 12px;
  }
  .post-reply-count { display: flex; align-items: center; gap: 4px; }
  .post-body-full {
    padding: 0 16px 14px; font-size: .88rem; color: var(--text);
    line-height: 1.55; white-space: pre-wrap; display: none;
  }
  .post-card.expanded .post-body-full { display: block; }
  .replies-section { display: none; padding: 0 16px 14px; }
  .post-card.expanded .replies-section { display: block; }
  .replies-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .7rem; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted);
    padding: 8px 0 6px; border-top: 1px solid var(--border); margin-bottom: 8px;
  }
  .replies-scroll { max-height: 320px; overflow-y: auto; margin-bottom: 10px; }
  .reply-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
  }
  .reply-meta { font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  .reply-body { font-size: .84rem; color: var(--text); white-space: pre-wrap; }
  .reply-box { display: flex; gap: 8px; margin-top: 6px; }
  .reply-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; color: var(--text);
    font-family: inherit; font-size: .85rem; resize: none; box-sizing: border-box;
    transition: border-color .15s;
  }
  .reply-input:focus { outline: none; border-color: #FFD700; }
  .reply-send-btn {
    background: linear-gradient(135deg, #FFD700, #FFA500); color: #000;
    border: none; border-radius: 8px; padding: 8px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .82rem; cursor: pointer; white-space: nowrap;
    transition: opacity .15s;
  }
  .reply-send-btn:hover { opacity: .85; }
  .forum-empty {
    text-align: center; padding: 48px 20px; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 12px;
  }
  .forum-empty-icon { font-size: 2rem; margin-bottom: 10px; }

  /* Search */
  .wc-search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .wc-search {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; color: var(--text);
    font-family: inherit; font-size: .85rem; transition: border-color .15s;
  }
  .wc-search:focus { outline: none; border-color: #FFD700; }
  .search-count { font-size: .75rem; color: var(--muted); margin-bottom: 10px; display: none; }

  /* Light mode */
  html:not([data-theme="dark"]) .wc-title { color: #B8860B; }
  html:not([data-theme="dark"]) .wc-badge { box-shadow: 0 4px 16px rgba(184,134,11,.2); }
  html:not([data-theme="dark"]) .sb-score { color: #B8860B; }
  html:not([data-theme="dark"]) .match-banner-teams { color: #B8860B; }
  html:not([data-theme="dark"]) .wc-cat-tab.active,
  html:not([data-theme="dark"]) .wc-cat-tab:hover { border-color: #B8860B; color: #B8860B; background: rgba(184,134,11,.07); }
</style>

  <div class="header-inner">

  <!-- Header -->
  <div class="wc-header">

    <div class="wc-title-block">

  <div class="compose-box" id="composeBox">

        <div class="match-banner-score" id="matchBannerScore">—</div>
        <button class="match-banner-clear" id="matchBannerClear" title="Show all posts">✕</button>
      </div>

<script>
// ── STATE ────────────────────────────────────────────────────
let allPosts = [];
let allFixtures = [];
let currentUser = null;
let activeSubcat = 'all';
let activeMatchSubject = null; // e.g. "Mexico vs South Africa"
let searchQuery = '';
let expandedId = null;

// ── HELPERS ──────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cleanText(s) { return String(s||'').replace(/<[^>]*>/g,'').trim(); }
function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function fmtDay(iso) {
  return new Date(iso).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
}
function pillLabel(subcat) {
  return { match:'Match', decision:'Decision', general:'General' }[subcat] || subcat;
}
function toast(msg) {
  let t = document.getElementById('wcToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'wcToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 18px;border-radius:8px;font-size:.85rem;z-index:9999;pointer-events:none;transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._to);
  t._to = setTimeout(() => t.style.opacity = '0', 2200);
}

// ── DATA ─────────────────────────────────────────────────────
async function loadFixtures() {
  const { data } = await getSB()
    .from('RTR Fixtures')
    .select('id, home, away, score, status, kickoff')
    .eq('comp', 'WC')
    .order('kickoff', { ascending: true });
  return data || [];
}

async function loadPosts() {
  const { data } = await getSB()
    .from('RTR Forum')
    .select('id, user_id, username, category, subject, body, reply_to, created_at')
    .eq('category', 'worldcup')
    .order('created_at', { ascending: false })
    .limit(300);
  return data || [];
}

async function savePost(subject, subcat, body, replyTo) {
  if (!currentUser) { toast('Sign in to post'); return null; }
  const { data, error } = await getSB().from('RTR Forum').insert({
    user_id:  currentUser.id,
    username: currentUser.username || 'User',
    category: 'worldcup',
    subject:  cleanText(subject),
    body:     cleanText(body),
    reply_to: replyTo || null,
    matchweek: null,
    created_at: new Date().toISOString(),
    // store subcat in the subject prefix so we can filter without a schema change
    // subject format: "[match|decision|general] Actual Subject"
    // Actually we'll embed subcat in the subject as a prefix tag stored separately — use a body prefix trick
    // Better: just use subject as-is and store subcat as a JSON prefix in the body
  }).select().single();
  // Re-do: store subcat by prepending a hidden tag to the body
  // We'll store it as subject prefix: "[match]Subject" etc.
  if (error) { console.error(error); return null; }
  return data;
}

// We encode sub-category as a prefix in the subject: "match:Mexico vs South Africa"
// so we can filter without altering the DB schema
async function saveWCPost(subject, subcat, body, replyTo) {
  if (!currentUser) { toast('Sign in to post'); return null; }
  const encodedSubject = replyTo ? subject : `${subcat}:${cleanText(subject)}`;
  const { data, error } = await getSB().from('RTR Forum').insert({
    user_id:    currentUser.id,
    username:   currentUser.username || 'User',
    category:   'worldcup',
    subject:    encodedSubject,
    body:       cleanText(body),
    reply_to:   replyTo || null,
    matchweek:  null,
    created_at: new Date().toISOString(),
  }).select().single();
  if (error) { toast('Failed to post'); console.error(error); return null; }
  return data;
}

function decodePost(post) {
  if (post.reply_to) return { ...post, subcat: null, displaySubject: post.subject };
  const m = (post.subject || '').match(/^(match|decision|general):(.+)$/);
  if (m) return { ...post, subcat: m[1], displaySubject: m[2].trim() };
  return { ...post, subcat: 'general', displaySubject: post.subject };
}

// ── RENDER FIXTURES ──────────────────────────────────────────
function renderFixtures() {
  const el = document.getElementById('fixtureList');
  if (!allFixtures.length) { el.innerHTML = '<div style="padding:12px 14px;font-size:.78rem;color:var(--muted)">No fixtures found</div>'; return; }

  // Group by date
  const byDate = {};
  allFixtures.forEach(f => {
    const dateKey = f.kickoff ? f.kickoff.slice(0,10) : 'TBC';
    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push(f);
  });

  let html = '';
  Object.entries(byDate).forEach(([dateKey, fixtures]) => {
    const label = dateKey === 'TBC' ? 'TBC' : fmtDay(dateKey + 'T12:00:00');
    html += `<div class="sb-date-hdr">${label}</div>`;
    fixtures.forEach(f => {
      const isActive = activeMatchSubject === `${f.home} vs ${f.away}`;
      const score = f.status === 'complete' && f.score
        ? `<div class="sb-score">${f.score}</div>`
        : f.status === 'upcoming' && f.kickoff
          ? `<div class="sb-score upcoming">${fmtTime(f.kickoff)}</div>`
          : `<div class="sb-score upcoming">-</div>`;
      html += `<div class="sb-fixture${isActive?' active':''}" data-home="${esc(f.home)}" data-away="${esc(f.away)}" data-score="${esc(f.score||'')}">
        <div class="sb-teams">
          <div class="sb-team-name">${esc(f.home)}</div>
          <div class="sb-team-name" style="color:var(--muted)">${esc(f.away)}</div>
        </div>
        ${score}
      </div>`;
    });
  });
  el.innerHTML = html;

  el.querySelectorAll('.sb-fixture').forEach(row => {
    row.addEventListener('click', () => {
      const home  = row.dataset.home;
      const away  = row.dataset.away;
      const score = row.dataset.score;
      const title = `${home} vs ${away}`;
      if (activeMatchSubject === title) {
        activeMatchSubject = null;
      } else {
        activeMatchSubject = title;
        // Pre-fill compose subject
        document.getElementById('composeSubject').value = title;
        document.getElementById('composeSubcat').value = 'match';
        // Show match banner
        document.getElementById('matchBanner').style.display = 'flex';
        document.getElementById('matchBannerTeams').textContent = title;
        document.getElementById('matchBannerScore').textContent = score || '–';
      }
      if (!activeMatchSubject) {
        document.getElementById('matchBanner').style.display = 'none';
      }
      renderFixtures();
      renderPosts();
    });
  });
}

// ── RENDER POSTS ─────────────────────────────────────────────
function renderPosts() {
  const el = document.getElementById('wcPostList');
  const topLevel = allPosts
    .filter(p => !p.reply_to)
    .map(decodePost)
    .filter(p => {
      if (activeSubcat !== 'all' && p.subcat !== activeSubcat) return false;
      if (activeMatchSubject && !p.displaySubject.toLowerCase().includes(activeMatchSubject.toLowerCase().split(' vs ')[0].toLowerCase())) {
        // match filter: show posts whose subject contains either team name
        const [home, away] = activeMatchSubject.split(' vs ');
        const ds = p.displaySubject.toLowerCase();
        if (!ds.includes(home.toLowerCase()) && !ds.includes((away||'').toLowerCase())) return false;
      }
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        if (!(p.displaySubject||'').toLowerCase().includes(q) &&
            !(p.body||'').toLowerCase().includes(q) &&
            !(p.username||'').toLowerCase().includes(q)) return false;
      }
      return true;
    });

  const countEl = document.getElementById('searchCount');
  if (searchQuery) {
    countEl.style.display = 'block';
    countEl.textContent = `${topLevel.length} result${topLevel.length!==1?'s':''} for "${searchQuery}"`;
  } else { countEl.style.display = 'none'; }

  if (!topLevel.length) {
    const matchHint = activeMatchSubject
      ? `<div style="margin-top:10px"><button class="wc-new-btn" id="startMatchThread" style="font-size:.82rem;padding:7px 14px">Start a ${activeMatchSubject} thread</button></div>`
      : '';
    el.innerHTML = `<div class="forum-empty">
      <div class="forum-empty-icon">💬</div>
      <p>No posts yet${activeMatchSubject ? ' for this match' : ''} — be the first!</p>
      ${matchHint}
    </div>`;
    document.getElementById('startMatchThread')?.addEventListener('click', () => {
      document.getElementById('composeSubject').value = activeMatchSubject;
      document.getElementById('composeSubcat').value = 'match';
      document.getElementById('composeBox').classList.add('open');
      document.getElementById('composeBody').focus();
    });
    return;
  }

  function renderCard(p) {
    const decoded = p; // already decoded
    const replies = allPosts.filter(r => r.reply_to === p.id).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const isExp = expandedId === p.id;
    const preview = (p.body||'').length > 130 ? p.body.slice(0,130)+'…' : (p.body||'');
    const repliesHtml = replies.map(r => `
      <div class="reply-card">
        <div class="reply-meta"><strong>${esc(r.username)}</strong> · ${fmtDate(r.created_at)}</div>
        <div class="reply-body">${esc(r.body)}</div>
      </div>`).join('');
    return `<div class="post-card${isExp?' expanded':''}" data-pid="${p.id}">
      <div class="post-head">
        <div class="post-meta-row">
          <span class="wc-pill ${decoded.subcat||'general'}">${pillLabel(decoded.subcat||'general')}</span>
          <span class="post-author">by <strong>${esc(p.username)}</strong> · ${fmtDate(p.created_at)}</span>
        </div>
        <div class="post-subject">${esc(decoded.displaySubject)}</div>
        <div class="post-preview">${esc(preview)}</div>
      </div>
      <div class="post-footer">
        <span class="post-reply-count">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          ${replies.length} ${replies.length===1?'reply':'replies'}
        </span>
      </div>
      <div class="post-body-full">${esc(p.body)}</div>
      <div class="replies-section">
        ${replies.length ? `<div class="replies-label">${replies.length} ${replies.length===1?'Reply':'Replies'}</div><div class="replies-scroll" id="rsc-${p.id}">${repliesHtml}</div>` : `<div class="replies-scroll" id="rsc-${p.id}"></div>`}
        <div class="reply-box">
          <textarea class="reply-input" data-rpid="${p.id}" placeholder="Write a reply…" rows="1" maxlength="1000"></textarea>
          <button class="reply-send-btn" data-rpid="${p.id}">Reply</button>
        </div>
      </div>
    </div>`;
  }

  el.innerHTML = topLevel.map(renderCard).join('');

  // Click to expand/collapse
  el.querySelectorAll('.post-head').forEach(h => {
    h.addEventListener('click', () => {
      const pid = +h.closest('.post-card').dataset.pid;
      expandedId = expandedId === pid ? null : pid;
      renderPosts();
      if (expandedId) {
        setTimeout(() => {
          const card = el.querySelector(`.post-card[data-pid="${pid}"]`);
          if (card) card.scrollIntoView({ behavior:'smooth', block:'start' });
          const rsc = document.getElementById(`rsc-${pid}`);
          if (rsc) rsc.scrollTop = rsc.scrollHeight;
        }, 50);
      }
    });
  });

  // Reply send
  el.querySelectorAll('.reply-send-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!currentUser) { toast('Sign in to reply'); return; }
      const pid = +btn.dataset.rpid;
      const ta = el.querySelector(`.reply-input[data-rpid="${pid}"]`);
      const body = ta?.value.trim();
      if (!body) return;
      btn.disabled = true;
      const parent = allPosts.find(p => p.id === pid);
      const result = await saveWCPost(parent?.subject || '', null, body, pid);
      if (result) {
        allPosts.unshift(result);
        expandedId = pid;
        renderPosts();
        toast('Reply posted!');
      }
      btn.disabled = false;
    });
  });

  // Auto-expand reply textareas
  el.querySelectorAll('.reply-input').forEach(ta => {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
}

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  currentUser = getCurrentUser();

  const [fixtures, posts] = await Promise.all([loadFixtures(), loadPosts()]);
  allFixtures = fixtures;
  allPosts = posts;

  renderFixtures();
  renderPosts();

  // New post button
  document.getElementById('newPostBtn').addEventListener('click', () => {
    const box = document.getElementById('composeBox');
    box.classList.toggle('open');
    if (box.classList.contains('open')) document.getElementById('composeBody').focus();
  });

  // Cancel compose
  document.getElementById('composeCancelBtn').addEventListener('click', () => {
    document.getElementById('composeBox').classList.remove('open');
  });

  // Submit compose
  document.getElementById('composeSubmitBtn').addEventListener('click', async () => {
    if (!currentUser) { toast('Sign in to post'); return; }
    const subject = document.getElementById('composeSubject').value.trim();
    const subcat  = document.getElementById('composeSubcat').value;
    const body    = document.getElementById('composeBody').value.trim();
    if (!subject) { toast('Please enter a subject'); return; }
    if (!body)    { toast('Please enter some text'); return; }
    const btn = document.getElementById('composeSubmitBtn');
    btn.disabled = true;
    const result = await saveWCPost(subject, subcat, body, null);
    if (result) {
      allPosts.unshift(result);
      document.getElementById('composeBox').classList.remove('open');
      document.getElementById('composeSubject').value = '';
      document.getElementById('composeBody').value = '';
      expandedId = result.id;
      renderPosts();
      toast('Post submitted!');
    }
    btn.disabled = false;
  });

  // Category tabs
  document.getElementById('wcCatTabs').addEventListener('click', e => {
    const tab = e.target.closest('[data-subcat]');
    if (!tab) return;
    activeSubcat = tab.dataset.subcat;
    document.querySelectorAll('.wc-cat-tab').forEach(t => t.classList.toggle('active', t.dataset.subcat === activeSubcat));
    renderPosts();
  });

  // Match banner clear
  document.getElementById('matchBannerClear').addEventListener('click', () => {
    activeMatchSubject = null;
    document.getElementById('matchBanner').style.display = 'none';
    renderFixtures();
    renderPosts();
  });

  // Search
  let searchTimer;
  document.getElementById('wcSearch').addEventListener('input', e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      searchQuery = e.target.value.trim();
      renderPosts();
    }, 250);
  });
}

init().catch(console.error);
</script>
</body>
</html>
