<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#37003c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RefRater">
<link rel="apple-touch-icon" href="/images/logos/RRlogo192.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RefRater — Forum</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7289925014125722" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
<style>
  body { background: var(--bg); }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 50% at 20% 30%, rgba(55,0,60,.4) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 70%, rgba(80,0,90,.25) 0%, transparent 65%);
    pointer-events: none; z-index: 0;
  }

  .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  .forum-layout { display: flex; gap: 20px; align-items: flex-start; }
  .forum-sidebar {
    width: 210px; flex-shrink: 0;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 0;
    position: sticky; top: 80px;
    max-height: calc(100vh - 100px); overflow-y: auto;
  }
  .sidebar-heading {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .72rem; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted);
    padding: 0 14px 10px; border-bottom: 1px solid var(--border);
    margin-bottom: 6px;
  }
  .sidebar-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 14px; cursor: pointer;
    transition: background .12s; border-left: 2px solid transparent;
    text-decoration: none;
  }
  .sidebar-item:hover { background: rgba(255,255,255,.04); }
  .sidebar-item.active { border-left-color: var(--pl-green); background: rgba(0,255,133,.06); }
  .sidebar-item .sidebar-label,
  .sidebar-item:hover .sidebar-label,
  .sidebar-item.active .sidebar-label { color: var(--text); }
  .sidebar-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
  }
  .sidebar-dot.general  { background: #9ca3af; }
  .sidebar-dot.referee  { background: var(--yellow); }
  .sidebar-dot.game     { background: var(--pl-green); }
  .sidebar-dot.decision { background: var(--red); }
  .sidebar-label {
    font-size: .78rem; color: var(--text); line-height: 1.35;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .sidebar-cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px; cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .78rem; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); transition: color .12s;
    user-select: none;
  }
  .sidebar-cat-header:hover { color: var(--text); }
  .sidebar-cat-header .cat-arrow { font-size: .6rem; transition: transform .2s; }
  .sidebar-cat-header.open .cat-arrow { transform: rotate(90deg); }
  .sidebar-cat-threads { display: none; }
  .sidebar-cat-threads.open { display: block; }
  .sidebar-cat-threads .sidebar-item { padding-left: 22px; }
  .sidebar-mw-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px 2px 22px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .6rem; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,.05);
    margin-top: 2px;
    cursor: pointer; user-select: none;
    transition: color .12s;
  }
  .sidebar-mw-header:hover { color: var(--text); }
  .sidebar-mw-header:first-child { border-top: none; margin-top: 0; }
  .sidebar-mw-header .mw-arrow { font-size: .55rem; transition: transform .18s; }
  .sidebar-mw-header.mw-collapsed .mw-arrow { transform: rotate(-90deg); }
  .sidebar-mw-threads.mw-hidden { display: none; }
  .mw-divider {
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .68rem;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted);
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
    margin: 20px 0 12px;
    cursor: pointer; user-select: none;
    transition: color .12s;
  }
  .mw-divider:hover { color: var(--text); }
  .mw-divider:first-child { margin-top: 0; }
  .mw-divider .mw-arrow { font-size: .6rem; transition: transform .18s; }
  .mw-divider.mw-collapsed .mw-arrow { transform: rotate(-90deg); }
  .mw-posts-group.mw-hidden { display: none; }
  .forum-main { flex: 1; min-width: 0; }
  @media (max-width: 700px) {
    .forum-layout { flex-direction: column; }
    .forum-sidebar { width: 100%; position: static; max-height: none; }
  }

  /* ── PAGE HEADER ── */
  .forum-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; gap: 12px; flex-wrap: wrap;
  }
  .forum-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 2rem; text-transform: uppercase;
    letter-spacing: 1px; color: var(--pl-green);
  }
  .new-post-btn {
    background: var(--pl-green); color: #fff;
    border: none; border-radius: 8px;
    padding: 9px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .9rem;
    letter-spacing: .5px; text-transform: uppercase;
    cursor: pointer; transition: opacity .15s;
    white-space: nowrap;
  }
  .new-post-btn:hover { opacity: .85; }

  /* ── CATEGORY TABS ── */
  .cat-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .cat-tab {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .85rem;
    letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted); cursor: pointer;
    transition: all .15s;
  }
  .cat-tab.active, .cat-tab:hover {
    border-color: var(--pl-green);
    color: var(--pl-green);
    background: rgba(0,255,133,.07);
  }

  /* ── COMPOSE FORM ── */
  .compose-box {
    background: var(--surface2);
    border: 1px solid rgba(0,255,133,.3);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    display: none;
  }
  .compose-box.open { display: block; }
  .compose-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 1rem; text-transform: uppercase;
    letter-spacing: .5px; color: var(--pl-green);
    margin-bottom: 14px;
  }
  .compose-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .compose-select, .compose-input, .compose-textarea {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: .85rem;
    transition: border-color .15s;
    outline: none;
  }
  .compose-select:focus, .compose-input:focus, .compose-textarea:focus {
    border-color: rgba(0,255,133,.4);
  }
  .compose-select { min-width: 140px; }
  .compose-input { flex: 1; min-width: 200px; }
  .compose-textarea {
    width: 100%; min-height: 90px; resize: vertical;
    margin-bottom: 10px;
  }
  .compose-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .compose-cancel {
    background: none; border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 16px;
    color: var(--muted); font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .82rem; letter-spacing: .5px;
    text-transform: uppercase; cursor: pointer; transition: all .15s;
  }
  .compose-cancel:hover { border-color: var(--text); color: var(--text); }
  .compose-submit {
    background: var(--pl-green); color: #fff;
    border: none; border-radius: 7px;
    padding: 8px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: .82rem; letter-spacing: .5px;
    text-transform: uppercase; cursor: pointer; transition: opacity .15s;
  }
  .compose-submit:hover { opacity: .85; }
  .compose-submit:disabled { opacity: .45; cursor: not-allowed; }

  /* ── POST CARDS ── */
  .post-list { display: flex; flex-direction: column; gap: 10px; }

  .post-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color .2s;
    cursor: pointer;
  }
  .post-card:hover { border-color: rgba(255,255,255,.12); }
  .post-card.expanded { border-color: rgba(0,255,133,.25); cursor: default; }

  .post-head {
    padding: 14px 16px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .post-meta-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .cat-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .68rem; letter-spacing: 1px;
    text-transform: uppercase; padding: 2px 8px; border-radius: 4px;
    flex-shrink: 0;
  }
  .cat-pill.general  { background: rgba(107,114,128,.2); color: var(--muted); }
  .cat-pill.referee  { background: rgba(255,211,42,.12); color: var(--yellow); }
  .cat-pill.game     { background: rgba(0,255,133,.1);   color: var(--pl-green); }
  .cat-pill.decision { background: rgba(255,71,87,.1);   color: var(--red); }
  .post-author {
    font-size: .75rem; color: var(--muted);
  }
  .post-author strong { color: var(--text); }
  .post-subject {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: 1.05rem; color: var(--text);
    line-height: 1.3;
  }
  .post-preview {
    font-size: .82rem; color: var(--muted);
    line-height: 1.55; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .post-footer {
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px 12px;
  }
  .post-reply-count {
    font-size: .75rem; color: var(--muted);
    display: flex; align-items: center; gap: 4px;
  }
  .post-reply-count svg { opacity: .6; }

  /* ── EXPANDED BODY ── */
  .post-body-full {
    display: none;
    padding: 0 16px 16px;
    font-size: .86rem; color: var(--text);
    line-height: 1.7;
    border-top: 1px solid var(--border);
    margin-top: 4px; padding-top: 14px;
  }
  .post-card.expanded .post-body-full { display: block; }
  .post-card.expanded .post-preview { display: none; }

  /* ── REPLIES ── */
  .replies-section {
    display: none;
    padding: 0 16px 16px;
  }
  .post-card.expanded .replies-section { display: block; }
  .replies-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .72rem; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
    padding-top: 12px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .replies-scroll {
    max-height: 220px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  @media(max-width:600px){
    .replies-scroll { max-height: calc(100dvh - 320px); }
  }
  .replies-scroll::-webkit-scrollbar { width: 4px; }
  .replies-scroll::-webkit-scrollbar-track { background: transparent; }
  .replies-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .reply-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .reply-meta {
    font-size: .7rem; color: var(--muted);
    margin-bottom: 3px;
  }
  .reply-meta strong { color: var(--text); }
  .reply-body {
    font-size: .82rem; color: var(--text); line-height: 1.55;
  }

  /* ── REPLY BOX ── */
  .reply-box {
    margin-top: 10px;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .reply-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: .83rem;
    resize: none; min-height: 38px;
    outline: none; transition: border-color .15s;
  }
  .reply-input:focus { border-color: rgba(0,255,133,.35); }
  .reply-send-btn {
    background: rgba(0,255,133,.12);
    border: 1px solid rgba(0,255,133,.3);
    border-radius: 7px;
    padding: 8px 14px;
    color: var(--pl-green);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .82rem; letter-spacing: .5px;
    text-transform: uppercase; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .reply-send-btn:hover { background: rgba(0,255,133,.2); }
  .reply-send-btn:disabled { opacity: .45; cursor: not-allowed; }

  /* ── MATCHWEEK FILTER ── */
  .mw-filter {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .mw-filter-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: .72rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); flex-shrink: 0;
  }
  .mw-select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px;
    color: var(--text); font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .85rem;
    cursor: pointer; outline: none; transition: border-color .15s;
  }
  .mw-select:focus { border-color: rgba(0,255,133,.4); }

  /* ── SEARCH BAR ── */
  .forum-search-wrap {
    position: relative; margin-bottom: 14px;
  }
  .forum-search-input {
    width: 100%; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 36px 9px 36px;
    color: var(--text); font-family: 'Barlow', sans-serif; font-size: .85rem;
    outline: none; transition: border-color .15s;
  }
  .forum-search-input:focus { border-color: rgba(0,255,133,.4); }
  .forum-search-input::placeholder { color: var(--muted); }
  .forum-search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; font-size: .9rem;
  }
  .forum-search-clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: .9rem; padding: 2px 4px;
    display: none; transition: color .12s;
  }
  .forum-search-clear:hover { color: var(--text); }
  .forum-search-clear.visible { display: block; }
  .search-count {
    font-size: .72rem; color: var(--muted);
    margin-bottom: 10px; padding-left: 2px;
  }
  mark {
    background: rgba(0,255,133,.25); color: var(--text);
    border-radius: 2px; padding: 0 1px;
  }

  /* ── REF PILL (in game posts) ── */
  .ref-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,211,42,.12); border: 1px solid rgba(255,211,42,.3);
    color: var(--yellow); font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700; font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px; text-decoration: none;
    transition: background .13s;
  }
  .ref-pill:hover { background: rgba(255,211,42,.22); }

  /* ── REF DISCUSSION CARDS ── */
  .ref-disc-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; transition: border-color .2s;
    margin-bottom: 6px;
  }
  .ref-disc-card:hover { border-color: rgba(255,211,42,.25); }
  .ref-disc-card.open { border-color: rgba(255,211,42,.4); }
  .ref-disc-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer; user-select: none;
  }
  .ref-disc-name {
    font-family: 'Barlow Condensed', sans-serif; font-weight: 800;
    font-size: 1rem; color: var(--text);
  }
  .ref-disc-meta { font-size: .72rem; color: var(--muted); margin-top: 1px; }
  .ref-disc-body { padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .ref-disc-body .replies-scroll { margin-top: 10px; }

  /* ── EMPTY / LOADING ── */
  .forum-empty {
    text-align: center; padding: 60px 20px;
    color: var(--muted);
  }
  .forum-empty-icon { font-size: 2.4rem; margin-bottom: 12px; }
  .forum-empty p {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600; font-size: 1rem;
    text-transform: uppercase; letter-spacing: 1px;
  }
  .forum-loading {
    display: flex; flex-direction: column; gap: 10px;
  }
  .post-skel {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 12px; height: 100px;
    animation: skelPulse 1.4s ease-in-out infinite;
  }
  @keyframes skelPulse { 0%,100%{opacity:.4} 50%{opacity:.7} }

  @media (max-width: 600px) {
    .forum-header { flex-direction: column; align-items: flex-start; }
    .compose-row { flex-direction: column; }
    .compose-select, .compose-input { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="matches.html"><img src="images/logos/RRLogo.svg" alt="RefRater" style="height:44px;width:auto;display:block;"></a>
    <div class="header-right">
      <nav>
        <a href="matches.html">Matches</a>
        <a href="referees.html">Referees</a>
        <a href="badges.html">Cards</a>
        <a href="forum.html" class="active">Forum</a>
      </nav>
      <button class="hamburger" id="hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
      <div class="user-chip" id="userChip">
        <div class="uc-avatar" id="ucAvatar"></div>
        <span class="uc-name" id="ucName"></span>
        <span id="ucTeamEmoji"></span>
        <span style="color:var(--muted);font-size:.7rem;margin-left:2px">▾</span>
        <div class="user-dropdown" id="userDropdown">
          <div class="dd-head">
            <div class="dd-uname" id="ddName"></div>
            <div class="dd-team" id="ddTeam"></div>
          </div>
          <div class="dd-item" onclick="location.href='badges.html'">🏅 Cards</div>
          <div class="dd-item admin-only" style="display:none" onclick="location.href='fantasy.html'"><img src="images/logos/PVBBlogo-removebg-preview.png" alt="PVBB" style="height:16px;width:auto;vertical-align:middle;margin-right:6px;">PVBB</div>
          <div class="dd-item admin-only" style="display:none" onclick="location.href='team_task_manager.html'">📋 Tasks</div>
          <div class="dd-item danger" id="ddLogout">↩ Sign out</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="mobile-nav" id="mobileNav">
  <a href="matches.html">Matches</a>
  <a href="referees.html">Referees</a>
  <a href="badges.html">Cards</a>
  <a href="forum.html" class="active">Forum</a>
</div>

<div class="page">

  <div class="forum-header">
    <div class="forum-title">Forum</div>
    <button class="new-post-btn" id="newPostBtn">+ New Post</button>
  </div>

  <!-- Compose form -->
  <div class="compose-box" id="composeBox">
    <div class="compose-title">New Post</div>
    <div class="compose-row">
      <select class="compose-select" id="compCat">
        <option value="general">💬 General</option>
        <option value="referee">🟡 Referee</option>
        <option value="game">Game</option>
        <option value="decision">⚖️ Decision</option>
      </select>
<input class="compose-input" id="compSubject" type="text" placeholder="Subject…" maxlength="120">
    </div>
    <textarea class="compose-textarea" id="compBody" placeholder="Write your post…" maxlength="2000"></textarea>
    <div class="compose-actions">
      <button class="compose-cancel" id="compCancel">Cancel</button>
      <button class="compose-submit" id="compSubmit">Post</button>
    </div>
  </div>

  <div class="forum-layout">

    <!-- Sidebar -->
    <div class="forum-sidebar" id="forumSidebar">
      <div class="sidebar-heading">Threads</div>
    </div>

    <!-- Main -->
    <div class="forum-main">
      <!-- Category filter -->
      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="all">All</button>
        <button class="cat-tab" data-cat="referee">🟡 Referees</button>
        <button class="cat-tab" data-cat="game">Games</button>
        <button class="cat-tab" data-cat="decision">⚖️ Decisions</button>
        <button class="cat-tab" data-cat="general">💬 General</button>
      </div>

      <!-- Search -->
      <div class="forum-search-wrap">
        <span class="forum-search-icon">🔍</span>
        <input class="forum-search-input" id="forumSearch" type="text" placeholder="Search posts, games, decisions…" maxlength="120" autocomplete="off">
        <button class="forum-search-clear" id="forumSearchClear" aria-label="Clear search">✕</button>
      </div>
      <div class="search-count" id="searchCount" style="display:none"></div>

      <!-- Matchweek filter (Games only) -->
      <div class="mw-filter" id="mwFilterBar" style="display:none"></div>

      <!-- Post list -->
      <div id="postList">
        <div class="forum-loading">
          <div class="post-skel"></div>
          <div class="post-skel"></div>
          <div class="post-skel"></div>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── HELPERS ───────────────────────────────────────────────
let currentUser = null;
let activeCategory = 'all';
let activeMatchweek = null;
let searchQuery = '';
let expandedRefId = null;
let allPosts = [];

function toast(msg, dur = 3000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function timeAgo(dateStr) {
  const sec = Math.floor((Date.now() - new Date(dateStr)) / 1000);
  if (sec < 60)   return 'just now';
  if (sec < 3600) return `${Math.floor(sec/60)}m ago`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ago`;
  return `${Math.floor(sec/86400)}d ago`;
}

function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function catLabel(cat) {
  return { general:'General', referee:'Referee', game:'Game', decision:'Decision' }[cat] || cat;
}

function highlight(text, query) {
  if (!query) return esc(text);
  const safe = esc(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function postMatchesSearch(post, q) {
  if (!q) return true;
  const lower = q.toLowerCase();
  return (post.subject || '').toLowerCase().includes(lower) ||
         (post.body    || '').toLowerCase().includes(lower) ||
         (post.username|| '').toLowerCase().includes(lower);
}

// ── SUPABASE ─────────────────────────────────────────────
async function loadPosts() {
  if (PREVIEW_MODE) return [];
  const { data, error } = await getSB()
    .from('RTR Forum')
    .select('id, user_id, username, category, subject, body, reply_to, matchweek, ref_id, created_at')
    .order('created_at', { ascending: false })
    .limit(200);
  if (error) { console.error('[RTR] loadPosts error:', error); return []; }
  return data || [];
}

async function savePost(category, subject, body, replyTo, matchweek) {
  if (PREVIEW_MODE || !currentUser) return null;
  const { data, error } = await getSB().from('RTR Forum').insert({
    user_id: currentUser.id,
    username: currentUser.username || 'User',
    category,
    subject: cleanText(subject.trim()),
    body: cleanText(body.trim()),
    reply_to: replyTo || null,
    matchweek: matchweek || null,
    created_at: new Date().toISOString(),
  }).select().single();
  if (error) { console.error('[RTR] savePost error:', error); return null; }
  return data;
}

async function saveRefPost(refId, refName, body) {
  if (PREVIEW_MODE || !currentUser) return null;
  const { data, error } = await getSB().from('RTR Forum').insert({
    user_id: currentUser.id, username: currentUser.username || 'User',
    category: 'referee', subject: refName, body: cleanText(body.trim()),
    ref_id: refId, reply_to: null, matchweek: null,
    created_at: new Date().toISOString(),
  }).select().single();
  if (error) { console.error('[RTR] saveRefPost error:', error); return null; }
  return data;
}

// ── RENDER ────────────────────────────────────────────────
let expandedId = null;
const openSidebarCats = new Set(['game', 'decision', 'referee', 'general']); // all open by default
const openSidebarMWs = new Set(); // tracks open matchweek groups in sidebar: "${cat}-${mw}"
const collapsedMainMWs = new Set(); // tracks collapsed matchweek dividers in main area

function renderPosts() {
  // ── Sidebar (always updated first) ────────────────────
  const sidebar = document.getElementById('forumSidebar');
  sidebar.innerHTML = '<div class="sidebar-heading">Threads</div>';
  const CAT_ORDER = ['game', 'decision', 'referee', 'general'];
  const CAT_LABELS = { game: '⚽ Games', decision: '⚖️ Decisions', referee: '🟡 Referees', general: '💬 General' };
  const allTopLevel = allPosts.filter(p => !p.reply_to);
  CAT_ORDER.forEach(cat => {
    const posts = allTopLevel.filter(p => p.category === cat && postMatchesSearch(p, searchQuery));
    if (!posts.length) return;
    const isOpen = openSidebarCats.has(cat);
    const header = document.createElement('div');
    header.className = 'sidebar-cat-header' + (isOpen ? ' open' : '');
    header.innerHTML = `<span>${CAT_LABELS[cat]}</span><span class="cat-arrow">▶</span>`;
    header.addEventListener('click', () => {
      if (openSidebarCats.has(cat)) openSidebarCats.delete(cat);
      else openSidebarCats.add(cat);
      renderPosts();
    });
    sidebar.appendChild(header);
    const group = document.createElement('div');
    group.className = 'sidebar-cat-threads' + (isOpen ? ' open' : '');

    function addSidebarItem(post, target) {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (expandedId === post.id ? ' active' : '');
      item.innerHTML = `<span class="sidebar-dot ${post.category}"></span><span class="sidebar-label">${esc(post.subject)}</span>`;
      item.addEventListener('click', () => {
        expandedId = post.id;
        if (activeCategory !== 'all' && activeCategory !== post.category) {
          activeCategory = 'all';
          document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === 'all'));
        }
        renderPosts();
        setTimeout(() => {
          const card = document.querySelector(`.post-card[data-pid="${post.id}"]`);
          if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
      });
      (target || group).appendChild(item);
    }

    // Group posts by matchweek (most recent first), then ungrouped at the end
    const byMW = {};
    const noMW = [];
    posts.forEach(p => {
      if (p.matchweek) { if (!byMW[p.matchweek]) byMW[p.matchweek] = []; byMW[p.matchweek].push(p); }
      else noMW.push(p);
    });
    const mwKeys = Object.keys(byMW).map(Number).sort((a, b) => b - a);
    const hasMWGroups = mwKeys.length > 0;
    mwKeys.forEach((mw, i) => {
      const key = `${cat}-${mw}`;
      // Default: most recent MW open, others collapsed
      if (i === 0 && !openSidebarMWs.has(key) && !openSidebarMWs.has(`__init_${key}`)) {
        openSidebarMWs.add(key);
        openSidebarMWs.add(`__init_${key}`);
      }
      const isOpen = openSidebarMWs.has(key);
      const mwHdr = document.createElement('div');
      mwHdr.className = 'sidebar-mw-header' + (isOpen ? '' : ' mw-collapsed');
      if (i === 0) mwHdr.style.borderTop = 'none';
      mwHdr.innerHTML = `<span>Matchweek ${mw}</span><span class="mw-arrow">▾</span>`;
      const mwGroup = document.createElement('div');
      mwGroup.className = 'sidebar-mw-threads' + (isOpen ? '' : ' mw-hidden');
      byMW[mw].forEach(post => addSidebarItem(post, mwGroup));
      mwHdr.addEventListener('click', () => {
        if (openSidebarMWs.has(key)) openSidebarMWs.delete(key);
        else openSidebarMWs.add(key);
        renderPosts();
      });
      group.appendChild(mwHdr);
      group.appendChild(mwGroup);
    });
    if (noMW.length) {
      if (hasMWGroups) {
        const key = `${cat}-general`;
        if (!openSidebarMWs.has(`__init_${key}`)) {
          openSidebarMWs.add(key);
          openSidebarMWs.add(`__init_${key}`);
        }
        const isOpen = openSidebarMWs.has(key);
        const mwHdr = document.createElement('div');
        mwHdr.className = 'sidebar-mw-header' + (isOpen ? '' : ' mw-collapsed');
        mwHdr.innerHTML = `<span>General</span><span class="mw-arrow">▾</span>`;
        const mwGroup = document.createElement('div');
        mwGroup.className = 'sidebar-mw-threads' + (isOpen ? '' : ' mw-hidden');
        noMW.forEach(post => addSidebarItem(post, mwGroup));
        mwHdr.addEventListener('click', () => {
          if (openSidebarMWs.has(key)) openSidebarMWs.delete(key);
          else openSidebarMWs.add(key);
          renderPosts();
        });
        group.appendChild(mwHdr);
        group.appendChild(mwGroup);
      } else {
        noMW.forEach(post => addSidebarItem(post, group));
      }
    }

    sidebar.appendChild(group);
  });

  if (activeCategory === 'referee') { renderRefDiscussions(); return; }

  const el = document.getElementById('postList');

  // Matchweek filter dropdown (Games tab only)
  const mwBarEl = document.getElementById('mwFilterBar');
  if (activeCategory === 'game') {
    const gamePosts = allPosts.filter(p => !p.reply_to && p.category === 'game' && p.matchweek);
    const weeks = [...new Set(gamePosts.map(p => p.matchweek))].sort((a,b) => b-a);
    if (weeks.length) {
      if (activeMatchweek === null) activeMatchweek = weeks[0]; // default to most recent GW
      mwBarEl.innerHTML = `<span class="mw-filter-label">Matchweek</span>
        <select class="mw-select" id="mwSelect">
          ${weeks.map(w=>`<option value="${w}"${activeMatchweek===w?' selected':''}>Matchweek ${w}</option>`).join('')}
        </select>`;
      mwBarEl.style.display = 'flex';
      document.getElementById('mwSelect').addEventListener('change', function() {
        activeMatchweek = +this.value;
        renderPosts();
      });
    } else {
      mwBarEl.style.display = 'none';
    }
  } else {
    mwBarEl.style.display = 'none';
    activeMatchweek = null;
  }

  // top-level posts filtered by category, matchweek, and search
  const topLevel = allPosts.filter(p =>
    !p.reply_to &&
    (activeCategory === 'all' || p.category === activeCategory) &&
    (activeCategory !== 'game' || activeMatchweek === null || p.matchweek === activeMatchweek) &&
    postMatchesSearch(p, searchQuery)
  );

  // Search result count
  const countEl = document.getElementById('searchCount');
  if (searchQuery) {
    countEl.style.display = 'block';
    countEl.textContent = `${topLevel.length} result${topLevel.length !== 1 ? 's' : ''} for "${searchQuery}"`;
  } else {
    countEl.style.display = 'none';
  }

  if (!topLevel.length) {
    el.innerHTML = `<div class="forum-empty">
      <div class="forum-empty-icon">💬</div>
      <p>No posts yet — be the first to start a discussion</p>
    </div>`;
    return;
  }

  function renderPostCard(post) {
    const replies = allPosts.filter(p => p.reply_to === post.id).sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
    const isExpanded = expandedId === post.id;
    const preview = post.body.length > 120 ? post.body.slice(0, 120) + '…' : post.body;
    const refObj = post.ref_id ? REFS.find(r => r.id === post.ref_id) : null;
    const refPill = refObj ? `<a class="ref-pill" href="forum.html?ref=${refObj.id}">🟨 ${refObj.name}</a>` : '';
    const repliesHtml = replies.map(r => `
      <div class="reply-card">
        <div class="reply-meta"><strong>${esc(r.username)}</strong> · ${fmtDate(r.created_at)}</div>
        <div class="reply-body">${esc(r.body)}</div>
      </div>`).join('');
    const q = searchQuery;
    return `
      <div class="post-card${isExpanded ? ' expanded' : ''}" data-pid="${post.id}">
        <div class="post-head">
          <div class="post-meta-row">
            <span class="cat-pill ${post.category}">${catLabel(post.category)}</span>
            <span class="post-author">by <strong>${highlight(post.username, q)}</strong> · ${fmtDate(post.created_at)}</span>
          </div>
          <div class="post-subject">${highlight(post.subject, q)} ${refPill}</div>
          <div class="post-preview">${highlight(preview, q)}</div>
        </div>
        <div class="post-footer">
          <span class="post-reply-count">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            ${replies.length} ${replies.length === 1 ? 'reply' : 'replies'}
          </span>
        </div>
        <div class="post-body-full">${esc(post.body)}</div>
        <div class="replies-section">
          ${replies.length ? `<div class="replies-label"><span>${replies.length} ${replies.length === 1 ? 'Reply' : 'Replies'}</span></div><div class="replies-scroll" id="repliesScroll-${post.id}">${repliesHtml}</div>` : `<div class="replies-scroll" id="repliesScroll-${post.id}"></div>`}
          <div class="reply-box">
            <textarea class="reply-input" data-rpid="${post.id}" placeholder="Write a reply…" rows="1" maxlength="1000"></textarea>
            <button class="reply-send-btn" data-rpid="${post.id}">Reply</button>
          </div>
        </div>
      </div>`;
  }

  // Group posts by matchweek (most recent first), ungrouped at the end
  const postsByMW = {};
  const postsNoMW = [];
  topLevel.forEach(p => {
    if (p.matchweek) { if (!postsByMW[p.matchweek]) postsByMW[p.matchweek] = []; postsByMW[p.matchweek].push(p); }
    else postsNoMW.push(p);
  });
  const mwGroups = Object.keys(postsByMW).map(Number).sort((a, b) => b - a);
  const showDividers = mwGroups.length > 1 || (mwGroups.length === 1 && postsNoMW.length > 0);

  let html = '';
  mwGroups.forEach(mw => {
    const collapsed = collapsedMainMWs.has(mw);
    if (showDividers) html += `<div class="mw-divider${collapsed ? ' mw-collapsed' : ''}" data-mwkey="${mw}">
      <span>Matchweek ${mw}</span><span class="mw-arrow">▾</span>
    </div>`;
    html += `<div class="mw-posts-group${collapsed ? ' mw-hidden' : ''}" data-mwgroup="${mw}">`;
    html += postsByMW[mw].map(renderPostCard).join('');
    html += `</div>`;
  });
  if (postsNoMW.length) {
    const collapsed = collapsedMainMWs.has('general');
    if (showDividers) html += `<div class="mw-divider${collapsed ? ' mw-collapsed' : ''}" data-mwkey="general">
      <span>General</span><span class="mw-arrow">▾</span>
    </div>`;
    html += `<div class="mw-posts-group${collapsed ? ' mw-hidden' : ''}" data-mwgroup="general">`;
    html += postsNoMW.map(renderPostCard).join('');
    html += `</div>`;
  }
  el.innerHTML = html;

  // Wire matchweek divider collapse toggles
  el.querySelectorAll('.mw-divider').forEach(div => {
    div.addEventListener('click', () => {
      const key = div.dataset.mwkey;
      const numKey = isNaN(key) ? key : +key;
      if (collapsedMainMWs.has(numKey)) collapsedMainMWs.delete(numKey);
      else collapsedMainMWs.add(numKey);
      renderPosts();
    });
  });

  function scrollRepliesToBottom(pid) {
    const sc = document.getElementById(`repliesScroll-${pid}`);
    if (sc) sc.scrollTop = sc.scrollHeight;
  }

  // Wire click-to-expand on post heads
  el.querySelectorAll('.post-card').forEach(card => {
    const pid = +card.dataset.pid;
    card.querySelector('.post-head').addEventListener('click', () => {
      expandedId = expandedId === pid ? null : pid;
      renderPosts();
      if (expandedId === pid) setTimeout(() => scrollRepliesToBottom(pid), 30);
    });
    card.querySelector('.post-footer').addEventListener('click', () => {
      expandedId = expandedId === pid ? null : pid;
      renderPosts();
      if (expandedId === pid) setTimeout(() => scrollRepliesToBottom(pid), 30);
    });
  });

  // Scroll already-expanded thread to bottom on initial render
  if (expandedId) setTimeout(() => scrollRepliesToBottom(expandedId), 30);

  // Wire reply send buttons
  el.querySelectorAll('.reply-send-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const pid = +btn.dataset.rpid;
      const textarea = el.querySelector(`.reply-input[data-rpid="${pid}"]`);
      const body = textarea?.value.trim();
      if (!body) return;
      btn.disabled = true;
      const post = allPosts.find(p => p.id === pid);
      const reply = await savePost(post?.category || 'general', post?.subject || '', body, pid);
      if (reply) {
        allPosts = [...allPosts, reply];
        renderPosts();
        toast('Reply posted');
        setTimeout(() => scrollRepliesToBottom(pid), 30);
      } else {
        btn.disabled = false;
        toast('Failed to post reply — please try again');
      }
    });
  });

  // Auto-expand reply textareas
  el.querySelectorAll('.reply-input').forEach(ta => {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
}

function renderRefDiscussions() {
  const el = document.getElementById('postList');
  document.getElementById('mwFilterBar').style.display = 'none';

  if (!REFS.length) {
    el.innerHTML = `<div class="forum-empty"><div class="forum-empty-icon">🟡</div><p>Loading referees…</p></div>`;
    return;
  }

  const sorted = [...REFS].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  el.innerHTML = sorted.map(ref => {
    const refPosts = allPosts
      .filter(p => p.ref_id === ref.id && !p.reply_to)
      .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    const totalComments = refPosts.length;
    const isOpen = expandedRefId === ref.id;

    const commentsHtml = refPosts.map(post => `
      <div class="reply-card">
        <div class="reply-meta"><strong>${esc(post.username)}</strong> · ${fmtDate(post.created_at)}</div>
        <div class="reply-body">${esc(post.body)}</div>
      </div>`).join('');

    return `
      <div class="ref-disc-card${isOpen ? ' open' : ''}" data-refid="${ref.id}">
        <div class="ref-disc-head">
          <div style="flex:1">
            <div class="ref-disc-name">${esc(ref.name)}</div>
            <div class="ref-disc-meta">${totalComments} comment${totalComments !== 1 ? 's' : ''}</div>
          </div>
          <span style="color:var(--muted);font-size:.7rem">${isOpen ? '▲' : '▼'}</span>
        </div>
        ${isOpen ? `
        <div class="ref-disc-body">
          <div class="replies-scroll" id="refScroll-${ref.id}">${commentsHtml || '<div style="color:var(--muted);font-size:.82rem;padding:10px 0">No comments yet — be the first</div>'}</div>
          <div class="reply-box" style="margin-top:10px">
            <textarea class="reply-input" data-refid="${ref.id}" placeholder="Comment on ${esc(ref.name)}…" rows="1" maxlength="1000"></textarea>
            <button class="reply-send-btn ref-send" data-refid="${ref.id}">Post</button>
          </div>
        </div>` : ''}
      </div>`;
  }).join('');

  // Wire open/close
  el.querySelectorAll('.ref-disc-head').forEach(head => {
    const card = head.closest('.ref-disc-card');
    const refId = +card.dataset.refid;
    head.addEventListener('click', () => {
      expandedRefId = expandedRefId === refId ? null : refId;
      renderRefDiscussions();
      if (expandedRefId === refId) {
        setTimeout(() => {
          const sc = document.getElementById(`refScroll-${refId}`);
          if (sc) sc.scrollTop = sc.scrollHeight;
        }, 30);
      }
    });
  });

  // Wire send buttons
  el.querySelectorAll('.ref-send').forEach(btn => {
    btn.addEventListener('click', async () => {
      const refId = +btn.dataset.refid;
      const ta = el.querySelector(`.reply-input[data-refid="${refId}"]`);
      const body = ta?.value.trim();
      if (!body) return;
      btn.disabled = true;
      const ref = REFS.find(r => r.id === refId);
      const post = await saveRefPost(refId, ref?.name || '', body);
      if (post) {
        allPosts = [...allPosts, post];
        renderRefDiscussions();
        setTimeout(() => {
          const sc = document.getElementById(`refScroll-${refId}`);
          if (sc) sc.scrollTop = sc.scrollHeight;
        }, 30);
        toast('Comment posted');
      } else {
        btn.disabled = false;
        toast('Failed to post — please try again');
      }
    });
  });

  // Auto-expand textareas
  el.querySelectorAll('.reply-input[data-refid]').forEach(ta => {
    ta.addEventListener('input', () => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
}

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/\n/g,'<br>');
}

// ── HEADER ────────────────────────────────────────────────
function initHeader() {
  if (!currentUser) { window.location.href = 'login.html'; return; }
  applyUserAvatar(document.getElementById('ucAvatar'), currentUser);
  document.getElementById('ucName').textContent   = currentUser.username || 'User';
  if (isAdmin(currentUser)) document.querySelectorAll('.admin-only').forEach(el => el.style.display = '');
  const team = PL_TEAMS.find(t => t.name === currentUser.team);
  document.getElementById('ucTeamEmoji').textContent = '';
  document.getElementById('ddName').textContent   = currentUser.username || 'User';
  document.getElementById('ddTeam').textContent   = currentUser.team ? `${currentUser.team} fan` : 'No team set';

  document.getElementById('userChip').addEventListener('click', () => {
    document.getElementById('userDropdown').classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#userChip')) document.getElementById('userDropdown').classList.remove('open');
  });
  document.getElementById('ddLogout').addEventListener('click', async () => {
    await clearCurrentUser(); window.location.href = 'login.html';
  });
  document.getElementById('hamburger').addEventListener('click', () => {
    document.getElementById('mobileNav').classList.toggle('open');
  });
}

// ── CATEGORY TABS ─────────────────────────────────────────
document.querySelectorAll('.cat-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    activeCategory = btn.dataset.cat;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    expandedId = null;
    if (activeCategory !== 'referee') expandedRefId = null;
    renderPosts();
  });
});

// ── SEARCH ────────────────────────────────────────────────
const _searchInput = document.getElementById('forumSearch');
const _searchClear = document.getElementById('forumSearchClear');
let _searchDebounce;
_searchInput.addEventListener('input', () => {
  clearTimeout(_searchDebounce);
  _searchDebounce = setTimeout(() => {
    searchQuery = _searchInput.value.trim();
    _searchClear.classList.toggle('visible', !!searchQuery);
    renderPosts();
  }, 200);
});
_searchClear.addEventListener('click', () => {
  searchQuery = '';
  _searchInput.value = '';
  _searchClear.classList.remove('visible');
  renderPosts();
});

// ── COMPOSE ───────────────────────────────────────────────
document.getElementById('newPostBtn').addEventListener('click', () => {
  document.getElementById('composeBox').classList.toggle('open');
  if (document.getElementById('composeBox').classList.contains('open')) {
    document.getElementById('compSubject').focus();
  }
});
document.getElementById('compCancel').addEventListener('click', () => {
  document.getElementById('composeBox').classList.remove('open');
  document.getElementById('compSubject').value = '';
  document.getElementById('compBody').value = '';
  document.getElementById('compCat').value = 'general';
});
document.getElementById('compSubmit').addEventListener('click', async () => {
  const cat     = document.getElementById('compCat').value;
  const subject = document.getElementById('compSubject').value.trim();
  const body    = document.getElementById('compBody').value.trim();
  if (!subject) { toast('Please add a subject'); return; }
  if (!body)    { toast('Please add some text'); return; }
  const btn = document.getElementById('compSubmit');
  btn.disabled = true;
  const post = await savePost(cat, subject, body, null, null);
  btn.disabled = false;
  if (post) {
    allPosts = [post, ...allPosts];
    expandedId = null;
    document.getElementById('composeBox').classList.remove('open');
    document.getElementById('compSubject').value = '';
    document.getElementById('compBody').value = '';
    activeCategory = 'all';
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat==='all'));
    renderPosts();
    toast('Post published');
  } else {
    toast('Failed to post — please try again');
  }
});

// ── MAIN ──────────────────────────────────────────────────
(async function init() {
  const authed = await checkAuth();
  if (!authed) { window.location.href = 'login.html'; return; }
  currentUser = getCurrentUser();
  initHeader();
  await loadFromSheets();
  allPosts = await loadPosts();

  // ?ref=ID — open that referee's discussion section on load
  const refParam = new URLSearchParams(location.search).get('ref');
  if (refParam) {
    const refId = +refParam;
    if (REFS.find(r => r.id === refId)) {
      activeCategory = 'referee';
      expandedRefId = refId;
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.toggle('active', b.dataset.cat === 'referee'));
    }
  }

  renderPosts();
})();
</script>
<script>if("serviceWorker"in navigator){navigator.serviceWorker.register("/sw.js").catch(()=>{});}</script>
